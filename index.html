<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" id="theme-color-meta" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="status-bar-style-meta">
  
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>Words</title>

  <style>
    :root {
      --bg-white: #ffffff;
      --text-black: #000000;
      --bg-pure-black: #000000;
      --text-white: #ffffff;
      --notion-subtle: #8a8a8a;
      --soft-red: #ea5555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-white);
      color: var(--text-black);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body.instant-dark,
    body.instant-dark .page {
      background-color: var(--bg-pure-black) !important;
      color: var(--text-white) !important;
    }

    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #track {
      display: flex;
      width: 200%;
      height: 100%;
      transform: translateX(0%);
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.25, 1, 0.3, 1);
    }

    #track.show-archive {
      transform: translateX(-50%);
    }

    .page {
      width: 50%;
      height: 100%;
      position: relative;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ГОЛОВНИЙ ЕКРАН */
    #main-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    body.dark-mode {
      background-color: var(--bg-pure-black);
      color: var(--text-white);
    }

    .words-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4.8rem;
      width: 100%;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.3, 1), transform 0.28s cubic-bezier(0.25, 1, 0.3, 1);
    }

    .words-container.dimmed {
      opacity: 0.12 !important;
      pointer-events: none;
    }

    .word-item {
      font-size: 2.9rem;
      font-weight: 300;
      letter-spacing: -0.035em;
      cursor: pointer;
      line-height: 1;
      position: relative;
      display: inline-block;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.3, 1);
    }

    .word-item::after {
      content: '';
      position: absolute;
      left: -3%;
      top: 50%;
      width: 106%;
      height: 2px;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.3, 1);
      pointer-events: none;
    }

    .word-item.struck {
      opacity: 0.38;
    }

    .word-item.struck::after {
      transform: scaleX(1);
    }

    .words-container.pulse-finish {
      transform: scale(0.97);
    }

    /* ПОЛЕ ВВОДУ СЛОВА */
    #add-word-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      opacity: 0;
      pointer-events: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 8vh;
      transition: opacity 0.18s ease;
      z-index: 30;
    }

    #add-word-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* БЕЗ СМУЖКИ НАВІГАЦІЇ SAFARI (CONTENTEDITABLE) */
    .new-word-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 2.9rem;
      font-weight: 300;
      letter-spacing: -0.035em;
      text-align: center;
      color: var(--text-black);
      min-width: 40px;
      max-width: 85%;
      display: inline-block;
      caret-color: var(--text-black);
      white-space: nowrap;
      overflow: hidden;
    }

    /* СЛОВНИК-ІНБОКС */
    #archive-page {
      background-color: var(--bg-white);
      color: var(--text-black);
      padding: calc(3rem + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom) 0;
      overflow-y: auto;
      overflow-x: hidden;
      user-select: text;
      -webkit-user-select: text;
    }

    .archive-list {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .swipe-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.3s ease;
      max-height: 100px;
    }

    .swipe-wrapper.deleted {
      max-height: 0 !important;
      opacity: 0 !important;
      pointer-events: none;
    }

    .swipe-content {
      position: relative;
      z-index: 2;
      background-color: var(--bg-white);
      padding: 0.85rem 2.2rem;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.3, 1);
      display: flex;
      align-items: center;
    }

    .swipe-delete-btn {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 68px;
      background-color: var(--bg-white);
      color: var(--soft-red);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      cursor: pointer;
    }

    .swipe-delete-btn svg {
      stroke: var(--soft-red);
    }

    .archive-word-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: pointer;
      position: relative;
    }

    .archive-word {
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .word-progress-dots {
      display: flex;
      gap: 4.5px;
      align-items: center;
      height: 0;
      opacity: 0;
      overflow: hidden;
      transition: opacity 0.22s ease, height 0.22s ease, margin-top 0.22s ease;
      margin-top: 0;
    }

    .word-progress-dots.visible {
      height: 6px;
      opacity: 1;
      margin-top: 5px;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background-color: #dedede;
    }

    .dot.active {
      background-color: #000000;
    }

    .audio-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      user-select: none;
      width: 100%;
    }

    .play-btn-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: #000;
      flex-shrink: 0;
    }

    .play-btn-wrapper svg {
      fill: currentColor;
    }

    .audio-track {
      width: 130px;
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .audio-track::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #000000;
      border-radius: 1px;
    }

    .audio-row.active .audio-track::before {
      background-color: #e5e5e5;
    }

    .audio-progress {
      position: absolute;
      left: 0;
      height: 2px;
      width: 0%;
      background-color: #000000;
      border-radius: 1px;
      pointer-events: none;
    }

    .rec-date {
      font-size: 0.75rem;
      color: var(--notion-subtle);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .audio-row.active .rec-date {
      opacity: 1;
    }
  </style>
</head>
<body>

<div id="viewport">
  <div id="track">
    <section id="main-page" class="page">
      <div class="words-container" id="words-container"></div>
      
      <div id="add-word-overlay">
        <!-- contenteditable прибирає панель зі стрілками та галочкою -->
        <div id="new-word-input" class="new-word-input" contenteditable="plaintext-only" spellcheck="false" autocapitalize="none" inputmode="text"></div>
      </div>
    </section>

    <section id="archive-page" class="page">
      <div class="archive-list" id="archive-list"></div>
    </section>
  </div>
</div>

<script>
/* ================= 0. НАЛАШТУВАННЯ ХМАРНОГО БЕКАПУ ================= */
const BACKUP_CONFIG = {
  enabled: false,
  endpoint: 'https://your-api-endpoint.com/backup',
  apiKey: ''
};

/* ================= 1. БАЗА ДАНИХ (INDEXEDDB LOCAL-FIRST) ================= */
const DB_NAME = 'SpeakingSRS_DB';
const DB_VERSION = 4;
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('words')) d.createObjectStore('words', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('deletions')) d.createObjectStore('deletions', { keyPath: 'id' });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      seedInitialWords().then(resolve);
    };
    request.onerror = (e) => reject(e);
  });
}

async function seedInitialWords() {
  const words = await getAllWords();
  if (words.length === 0) {
    const list = ['figure out', 'whatever', 'sometimes', 'frank', 'creep', 'freak'];
    for (let i = 0; i < list.length; i++) {
      await saveWord({
        id: 'w_' + (Date.now() + i),
        text: list[i],
        level: 0,
        nextReview: 0,
        createdAt: Date.now() + i,
        synced: 0
      });
    }
  }
}

function getAllWords() {
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const tx = db.transaction('words', 'readonly');
    const req = tx.objectStore('words').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function saveWord(word) {
  return new Promise((resolve) => {
    if (!db) return resolve();
    word.synced = word.synced || 0;
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').put(word);
    tx.oncomplete = () => {
      resolve();
      triggerWifiSync();
    };
    tx.onerror = () => resolve();
  });
}

function deleteWordFromDB(id) {
  return new Promise((resolve) => {
    if (!db) return resolve();
    const tx = db.transaction(['words', 'deletions'], 'readwrite');
    tx.objectStore('words').delete(id);
    tx.objectStore('deletions').put({ id, type: 'word', deletedAt: Date.now(), synced: 0 });
    tx.oncomplete = () => {
      resolve();
      triggerWifiSync();
    };
    tx.onerror = () => resolve();
  });
}

async function saveRecordingSafe(rec) {
  return new Promise(async (resolve) => {
    if (!db) return resolve();
    try {
      let audioBuffer = null;
      if (rec.blob && rec.blob.arrayBuffer) {
        try { audioBuffer = await rec.blob.arrayBuffer(); } catch (e) {}
      }

      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').put({
        id: rec.id,
        date: rec.date,
        words: rec.words,
        audioBuffer: audioBuffer,
        mimeType: rec.mimeType || 'audio/mp4',
        createdAt: rec.createdAt || Date.now(),
        synced: 0
      });
      tx.oncomplete = () => {
        resolve();
        triggerWifiSync();
      };
      tx.onerror = () => resolve();
    } catch (err) {
      resolve();
    }
  });
}

function getAllRecordings() {
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const tx = db.transaction('recordings', 'readonly');
    const req = tx.objectStore('recordings').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function deleteRecordingFromDB(id) {
  return new Promise((resolve) => {
    if (!db) return resolve();
    const tx = db.transaction(['recordings', 'deletions'], 'readwrite');
    tx.objectStore('recordings').delete(id);
    tx.objectStore('deletions').put({ id, type: 'recording', deletedAt: Date.now(), synced: 0 });
    tx.oncomplete = () => {
      resolve();
      triggerWifiSync();
    };
    tx.onerror = () => resolve();
  });
}

/* ================= 2. ПЕРЕВІРКА WI-FI ТА СИНХРОНІЗАЦІЯ ================= */
function isWifiConnection() {
  if (!navigator.onLine) return false;
  
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conn) {
    if (conn.type) {
      return conn.type === 'wifi' || conn.type === 'ethernet';
    }
    if (conn.saveData) return false;
  }
  return navigator.onLine;
}

function bufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return window.btoa(binary);
}

let syncTimeout = null;
function triggerWifiSync() {
  if (!BACKUP_CONFIG.enabled || !isWifiConnection()) return;
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(performSync, 3000);
}

async function performSync() {
  if (!BACKUP_CONFIG.enabled || !isWifiConnection()) return;

  try {
    const words = await getAllWords();
    const recordings = await getAllRecordings();
    
    const unsyncedWords = words.filter(w => !w.synced);
    const unsyncedRecordings = recordings.filter(r => !r.synced);

    if (unsyncedWords.length === 0 && unsyncedRecordings.length === 0) return;

    const payload = {
      timestamp: Date.now(),
      words: unsyncedWords,
      recordings: unsyncedRecordings.map(r => ({
        id: r.id,
        date: r.date,
        words: r.words,
        createdAt: r.createdAt,
        mimeType: r.mimeType,
        audioBase64: r.audioBuffer ? bufferToBase64(r.audioBuffer) : null
      }))
    };

    const res = await fetch(BACKUP_CONFIG.endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(BACKUP_CONFIG.apiKey ? { 'Authorization': `Bearer ${BACKUP_CONFIG.apiKey}` } : {})
      },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      const tx = db.transaction(['words', 'recordings'], 'readwrite');
      const wStore = tx.objectStore('words');
      const rStore = tx.objectStore('recordings');

      unsyncedWords.forEach(w => { w.synced = 1; wStore.put(w); });
      unsyncedRecordings.forEach(r => { r.synced = 1; rStore.put(r); });
    }
  } catch (err) {}
}

window.addEventListener('online', triggerWifiSync);
if (navigator.connection) {
  navigator.connection.addEventListener('change', triggerWifiSync);
}

/* ================= 3. СИСТЕМНІ СМУГИ (STATUS BAR) ================= */
const themeColorMeta = document.getElementById('theme-color-meta');
const statusBarStyleMeta = document.getElementById('status-bar-style-meta');

function setSystemBarsTheme(isDark, instant = false) {
  const color = isDark ? '#000000' : '#ffffff';
  if (themeColorMeta) themeColorMeta.setAttribute('content', color);
  document.documentElement.style.backgroundColor = color;
  document.body.style.backgroundColor = color;

  if (isDark) {
    if (instant) document.body.classList.add('instant-dark');
    document.body.classList.add('dark-mode');
    if (statusBarStyleMeta) statusBarStyleMeta.setAttribute('content', 'black-translucent');
  } else {
    document.body.classList.remove('instant-dark', 'dark-mode');
    if (statusBarStyleMeta) statusBarStyleMeta.setAttribute('content', 'default');
  }
}

/* ================= 4. АЛГОРИТМ SRS ================= */
const INTERVALS = [
  0,
  4 * 60 * 60 * 1000,
  24 * 60 * 60 * 1000,
  3 * 24 * 60 * 60 * 1000,
  7 * 24 * 60 * 60 * 1000,
  30 * 24 * 60 * 60 * 1000
];

async function pickThreeWords() {
  const all = await getAllWords();
  if (all.length <= 3) return all;

  const now = Date.now();
  let pool = all.filter(w => (w.nextReview || 0) <= now);
  if (pool.length < 3) pool = [...all];

  pool.sort((a, b) => (a.level - b.level) + (Math.random() - 0.5));
  return pool.slice(0, 3);
}

/* ================= 5. АУДІОЗАПИС ЗІ СТИСНЕННЯМ (28 KBPS MONO) ================= */
let audioCtx = null;
let mediaRecorder = null;
let audioChunks = [];
let recordedMimeType = 'audio/mp4';
let beepTimeout = null;
let maxLimitTimeout = null;

function playBeep() {
  try {
    const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

async function startAudioRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 24000,
        echoCancellation: true,
        noiseSuppression: true
      }
    });
    
    recordedMimeType = 'audio/mp4';
    if (typeof MediaRecorder.isTypeSupported === 'function') {
      if (MediaRecorder.isTypeSupported('audio/mp4')) {
        recordedMimeType = 'audio/mp4';
      } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        recordedMimeType = 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/webm')) {
        recordedMimeType = 'audio/webm';
      }
    }

    const options = {
      audioBitsPerSecond: 28000
    };
    if (recordedMimeType) options.mimeType = recordedMimeType;

    mediaRecorder = new MediaRecorder(stream, options);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.start();

    beepTimeout = setTimeout(() => playBeep(), 105 * 1000);
    maxLimitTimeout = setTimeout(() => {
      if (appState === 'recording') stopSession();
    }, 120 * 1000);
  } catch (err) {
    console.warn('Мікрофон недоступний:', err);
  }
}

function stopAudioRecording() {
  clearTimeout(beepTimeout);
  clearTimeout(maxLimitTimeout);

  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      resolve(null);
      return;
    }
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: recordedMimeType });
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

/* ================= 6. УПРАВЛІННЯ UI ================= */
let appState = 'idle'; 
let currentWords = [];
let struckWordIds = new Set();
let lastRecordedBlob = null;
let justCancelledAddWord = false;

const track = document.getElementById('track');
const wordsContainer = document.getElementById('words-container');
const addWordOverlay = document.getElementById('add-word-overlay');
const newWordInput = document.getElementById('new-word-input');
const archiveList = document.getElementById('archive-list');

async function renderMainWords() {
  currentWords = await pickThreeWords();
  wordsContainer.innerHTML = '';
  currentWords.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word-item';
    el.dataset.id = w.id;
    el.textContent = w.text;
    wordsContainer.appendChild(el);
  });
}

function startSession() {
  appState = 'recording';
  setSystemBarsTheme(true, true);
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  startAudioRecording();
}

async function stopSession() {
  lastRecordedBlob = await stopAudioRecording();
  appState = 'review';
  struckWordIds.clear();

  if (navigator.vibrate) navigator.vibrate(40);
  wordsContainer.classList.add('pulse-finish');
  setTimeout(() => wordsContainer.classList.remove('pulse-finish'), 150);
}

async function completeReviewAndRefresh() {
  wordsContainer.style.opacity = '0';

  try {
    for (const w of currentWords) {
      if (struckWordIds.has(w.id)) {
        w.level = Math.min((w.level || 0) + 1, 5);
        w.nextReview = Date.now() + INTERVALS[w.level];
      } else {
        w.level = 0;
        w.nextReview = Date.now();
      }
      w.synced = 0;
      await saveWord(w);
    }

    if (lastRecordedBlob) {
      await saveRecordingSafe({
        id: 'rec_' + Date.now(),
        date: new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }),
        blob: lastRecordedBlob,
        mimeType: recordedMimeType,
        words: currentWords.map(w => w.text),
        createdAt: Date.now()
      });
    }
  } catch (err) {}

  setSystemBarsTheme(false, true);
  appState = 'idle';

  setTimeout(async () => {
    await renderMainWords();
    wordsContainer.style.opacity = '1';
  }, 160);
}

/* ================= 7. ДОДАВАННЯ СЛІВ (БЕЗ ПАНЕЛІ SAFARI) ================= */
function openAddWord() {
  if (appState !== 'idle') return;
  appState = 'adding';
  
  wordsContainer.classList.add('dimmed');
  addWordOverlay.classList.add('active');
  newWordInput.textContent = '';
  
  newWordInput.focus();
}

function cancelAddWord() {
  newWordInput.textContent = '';
  newWordInput.blur();
  addWordOverlay.classList.remove('active');
  wordsContainer.classList.remove('dimmed');
  appState = 'idle';

  justCancelledAddWord = true;
  setTimeout(() => {
    justCancelledAddWord = false;
  }, 250);
}

async function closeAndSaveNewWord() {
  const text = newWordInput.textContent.trim().toLowerCase();
  if (text) {
    const parts = text.split(/[,+\n]/).map(s => s.trim()).filter(Boolean);
    for (let i = 0; i < parts.length; i++) {
      await saveWord({
        id: 'w_' + (Date.now() + i),
        text: parts[i],
        level: 0,
        nextReview: 0,
        createdAt: Date.now() + i,
        synced: 0
      });
    }
  }
  newWordInput.blur();
  addWordOverlay.classList.remove('active');
  wordsContainer.classList.remove('dimmed');
  appState = 'idle';
  await renderMainWords();
}

addWordOverlay.addEventListener('click', (e) => {
  e.stopPropagation();
  if (e.target !== newWordInput) {
    cancelAddWord();
  }
});

/* ================= 8. СЛОВНИК-ІНБОКС ТА АУДІО ================= */
let activeAudio = null;
let activeAudioId = null;
let activeRowEl = null;

const SVG_PLAY = `<svg width="12" height="12" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
const SVG_PAUSE = `<svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"></rect><rect x="15" y="3" width="4" height="18"></rect></svg>`;

function handlePlayPause(rec, rowEl) {
  const btn = rowEl.querySelector('.play-btn-wrapper');
  const progressEl = rowEl.querySelector('.audio-progress');

  if (activeAudioId === rec.id && activeAudio) {
    if (activeAudio.paused) {
      activeAudio.play();
      btn.innerHTML = SVG_PAUSE;
      rowEl.classList.add('active');
    } else {
      activeAudio.pause();
      btn.innerHTML = SVG_PLAY;
    }
    return;
  }

  if (activeAudio) {
    activeAudio.pause();
    if (activeRowEl) {
      activeRowEl.querySelector('.play-btn-wrapper').innerHTML = SVG_PLAY;
      activeRowEl.classList.remove('active');
    }
  }

  let audioBlob = rec.blob;
  if (!audioBlob && rec.audioBuffer) {
    audioBlob = new Blob([rec.audioBuffer], { type: rec.mimeType || 'audio/mp4' });
  }
  if (!audioBlob) return;

  const audioUrl = URL.createObjectURL(audioBlob);
  activeAudio = new Audio(audioUrl);
  activeAudioId = rec.id;
  activeRowEl = rowEl;

  btn.innerHTML = SVG_PAUSE;
  rowEl.classList.add('active');

  activeAudio.play().catch(e => console.warn(e));

  activeAudio.ontimeupdate = () => {
    if (activeAudio && activeAudio.duration) {
      const pct = (activeAudio.currentTime / activeAudio.duration) * 100;
      progressEl.style.width = pct + '%';
    }
  };

  activeAudio.onended = () => {
    btn.innerHTML = SVG_PLAY;
    rowEl.classList.remove('active');
    progressEl.style.width = '0%';
    activeAudio = null;
    activeAudioId = null;
    activeRowEl = null;
  };

  activeAudio.onpause = () => {
    btn.innerHTML = SVG_PLAY;
  };
}

async function renderArchiveList() {
  const words = await getAllWords();
  const recordings = await getAllRecordings();

  const feed = [
    ...words.map(w => ({ type: 'word', item: w, createdAt: w.createdAt || 0 })),
    ...recordings.map(r => ({ type: 'recording', item: r, createdAt: r.createdAt || 0 }))
  ];
  feed.sort((a, b) => b.createdAt - a.createdAt);

  archiveList.innerHTML = '';
  feed.forEach(entry => {
    const wrapper = document.createElement('div');
    wrapper.className = 'swipe-wrapper';

    let contentHtml = '';
    if (entry.type === 'word') {
      const lvl = entry.item.level || 0;
      let dotsHtml = '';
      for (let i = 1; i <= 5; i++) {
        dotsHtml += `<span class="dot ${i <= lvl ? 'active' : ''}"></span>`;
      }

      contentHtml = `
        <div class="archive-word-wrapper">
          <div class="archive-word">${entry.item.text}</div>
          <div class="word-progress-dots">${dotsHtml}</div>
        </div>
      `;
    } else {
      contentHtml = `
        <div class="audio-row" data-id="${entry.item.id}">
          <div class="play-btn-wrapper">${SVG_PLAY}</div>
          <div class="audio-track">
            <div class="audio-progress"></div>
          </div>
          <span class="rec-date">${entry.item.date}</span>
        </div>
      `;
    }

    wrapper.innerHTML = `
      <div class="swipe-content">${contentHtml}</div>
      <div class="swipe-delete-btn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </div>
    `;

    if (entry.type === 'word') {
      const wordWrapper = wrapper.querySelector('.archive-word-wrapper');
      wordWrapper.onclick = (e) => {
        e.stopPropagation();
        const dotsEl = wordWrapper.querySelector('.word-progress-dots');
        dotsEl.classList.toggle('visible');
      };
    }

    if (entry.type === 'recording') {
      const audioRow = wrapper.querySelector('.audio-row');
      const playBtn = wrapper.querySelector('.play-btn-wrapper');
      const audioTrack = wrapper.querySelector('.audio-track');

      playBtn.onclick = (e) => {
        e.stopPropagation();
        handlePlayPause(entry.item, audioRow);
      };

      audioTrack.onclick = (e) => {
        e.stopPropagation();
        if (activeAudioId === entry.item.id && activeAudio && activeAudio.duration) {
          const rect = audioTrack.getBoundingClientRect();
          const clickPos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          activeAudio.currentTime = clickPos * activeAudio.duration;
          audioTrack.querySelector('.audio-progress').style.width = (clickPos * 100) + '%';
        } else {
          handlePlayPause(entry.item, audioRow);
        }
      };
    }

    const deleteBtn = wrapper.querySelector('.swipe-delete-btn');
    deleteBtn.onclick = async (e) => {
      e.stopPropagation();
      wrapper.classList.add('deleted');
      if (entry.type === 'word') {
        await deleteWordFromDB(entry.item.id);
      } else {
        await deleteRecordingFromDB(entry.item.id);
        if (activeAudioId === entry.item.id && activeAudio) {
          activeAudio.pause();
          activeAudio = null;
        }
      }
      setTimeout(() => wrapper.remove(), 350);
    };

    attachSwipeToDelete(wrapper);
    archiveList.appendChild(wrapper);
  });
}

function attachSwipeToDelete(wrapper) {
  const content = wrapper.querySelector('.swipe-content');
  let itemStartX = 0;
  let itemCurrentX = 0;
  let isOpen = false;

  content.addEventListener('touchstart', (e) => {
    itemStartX = e.touches[0].clientX;
    content.style.transition = 'none';
  }, { passive: true });

  content.addEventListener('touchmove', (e) => {
    const diff = e.touches[0].clientX - itemStartX;
    if (!isOpen && diff < 0) {
      itemCurrentX = Math.max(diff, -68);
      content.style.transform = `translateX(${itemCurrentX}px)`;
    } else if (isOpen && diff > 0) {
      itemCurrentX = Math.min(-68 + diff, 0);
      content.style.transform = `translateX(${itemCurrentX}px)`;
    }
  }, { passive: true });

  content.addEventListener('touchend', () => {
    content.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.3, 1)';
    if (!isOpen && itemCurrentX < -34) {
      content.style.transform = 'translateX(-68px)';
      isOpen = true;
    } else if (isOpen && itemCurrentX > -34) {
      content.style.transform = 'translateX(0px)';
      isOpen = false;
    } else {
      content.style.transform = isOpen ? 'translateX(-68px)' : 'translateX(0px)';
    }
  });
}

function openArchive() {
  appState = 'archive';
  renderArchiveList();
  track.classList.add('show-archive');
}

function closeArchive() {
  track.classList.remove('show-archive');
  appState = 'idle';
  if (activeAudio) {
    activeAudio.pause();
    activeAudio = null;
  }
}

/* ================= 9. ЖЕСТИ ТА ТАПИ ================= */
let startX = 0;
let startY = 0;
let isDragging = false;
let didSwipe = false;

window.addEventListener('pointerdown', (e) => {
  startX = e.clientX;
  startY = e.clientY;
  isDragging = true;
  didSwipe = false;
});

window.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  isDragging = false;

  const diffX = e.clientX - startX;
  const diffY = e.clientY - startY;
  const absX = Math.abs(diffX);
  const absY = Math.abs(diffY);

  if (absX > 45 || absY > 45) {
    didSwipe = true;

    if (diffY > 45 && absY > absX && appState === 'idle') {
      openAddWord();
      return;
    }
    if (diffX < -45 && absX > absY && appState === 'idle') {
      openArchive();
      return;
    }
    if (diffX > 45 && absX > absY && appState === 'archive') {
      closeArchive();
      return;
    }
  }
});

document.getElementById('main-page').addEventListener('click', async (e) => {
  if (didSwipe || justCancelledAddWord) return;

  if (appState === 'idle') {
    startSession();
    return;
  }

  if (appState === 'recording') {
    await stopSession();
    return;
  }

  if (appState === 'review') {
    const wordEl = e.target.closest('.word-item');
    if (wordEl) {
      const id = wordEl.dataset.id;
      if (struckWordIds.has(id)) {
        struckWordIds.delete(id);
        wordEl.classList.remove('struck');
      } else {
        struckWordIds.add(id);
        wordEl.classList.add('struck');
      }
    } else {
      await completeReviewAndRefresh();
    }
  }
});

newWordInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    await closeAndSaveNewWord();
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

initDB().then(() => {
  renderMainWords();
  triggerWifiSync();
});
</script>
