<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" id="theme-color-meta" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="status-bar-style-meta">
  <link rel="manifest" href="manifest.json">

  <title>Words</title>

  <style>
    :root {
      --bg-white: #ffffff;
      --text-black: #000000;
      --bg-pure-black: #000000;
      --text-white: #ffffff;
      --dim-opacity: 0.1;
      --notion-subtle: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-white);
      color: var(--text-black);
      /* Нативний системний шрифт: 0ms завантаження, максимальна чистота */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* БЕЗШОВНИЙ ГОРИЗОНТАЛЬНИЙ КАНВАС З ДВОХ СТОРІНОК */
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #track {
      display: flex;
      width: 200%;
      height: 100%;
      transform: translateX(0%);
      will-change: transform;
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1); /* Нативна крива ковзання iOS */
    }

    #track.show-archive {
      transform: translateX(-50%);
    }

    .page {
      width: 50%;
      height: 100%;
      position: relative;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ГОЛОВНИЙ ЕКРАН */
    #main-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    body.dark-mode {
      background-color: var(--bg-pure-black);
      color: var(--text-white);
    }

    .words-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4.8rem;
      width: 100%;
      transition: opacity 0.22s ease, transform 0.15s ease-out;
    }

    .word-item {
      font-size: 2.9rem;
      font-weight: 300;
      letter-spacing: -0.035em;
      cursor: pointer;
      line-height: 1;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .words-container.pulse-finish {
      transform: scale(0.96);
    }

    .word-item.struck {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      opacity: 0.55;
    }

    /* ПОЛЕ ВВОДУ СЛОВА */
    #add-word-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 8vh;
    }

    #add-word-overlay.active {
      display: flex;
    }

    .new-word-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 2.9rem;
      font-weight: 300;
      letter-spacing: -0.035em;
      text-align: center;
      color: var(--text-black);
      width: 85%;
      caret-color: var(--text-black);
    }

    .new-word-input::placeholder {
      color: rgba(0, 0, 0, 0.18);
    }

    .words-container.dimmed {
      opacity: var(--dim-opacity);
    }

    /* СЛОВНИК (NOTION-STYLE) */
    #archive-page {
      background-color: var(--bg-white);
      color: var(--text-black);
      padding: calc(3.5rem + env(safe-area-inset-top)) 2.2rem env(safe-area-inset-bottom) 2.2rem;
      overflow-y: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    .archive-header {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--notion-subtle);
      margin-bottom: 2.5rem;
      letter-spacing: -0.01em;
    }

    .archive-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .archive-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .archive-word {
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .archive-recordings {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .audio-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      color: var(--notion-subtle);
      cursor: pointer;
      width: fit-content;
    }

    .audio-row:active {
      opacity: 0.5;
    }

    .play-icon {
      font-size: 0.75rem;
      width: 12px;
      display: inline-block;
    }

    .rec-date {
      font-size: 0.75rem;
      color: var(--notion-subtle);
    }
  </style>
</head>
<body>

<div id="viewport">
  <div id="track">
    <!-- СТОРІНКА 1: ГОЛОВНИЙ ЕКРАН / ЗАПИС / РЕВ'Ю -->
    <section id="main-page" class="page">
      <div class="words-container" id="words-container"></div>
      
      <div id="add-word-overlay">
        <input type="text" id="new-word-input" class="new-word-input" placeholder="new word" autocomplete="off" autocapitalize="none" spellcheck="false" />
      </div>
    </section>

    <!-- СТОРІНКА 2: БЕЗШОВНИЙ СЛОВНИК + АРХІВ -->
    <section id="archive-page" class="page">
      <div class="archive-header">словник + архів записів</div>
      <div class="archive-list" id="archive-list"></div>
    </section>
  </div>
</div>

<script>
/* ================= 1. БАЗА ДАНИХ (INDEXEDDB) ================= */
const DB_NAME = 'SpeakingSRS_DB';
const DB_VERSION = 2;
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('words')) d.createObjectStore('words', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id' });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      seedInitialWords().then(resolve);
    };
    request.onerror = (e) => reject(e);
  });
}

async function seedInitialWords() {
  const words = await getAllWords();
  if (words.length === 0) {
    const list = ['figure out', 'whatever', 'sometimes', 'frank', 'creep', 'freak'];
    for (const text of list) {
      await saveWord({
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: text,
        level: 0,
        nextReview: 0,
        createdAt: Date.now()
      });
    }
  }
}

function getAllWords() {
  return new Promise((resolve) => {
    const tx = db.transaction('words', 'readonly');
    const req = tx.objectStore('words').getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

function saveWord(word) {
  return new Promise((resolve) => {
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').put(word);
    tx.oncomplete = () => resolve();
  });
}

function saveRecording(rec) {
  return new Promise((resolve) => {
    const tx = db.transaction('recordings', 'readwrite');
    tx.objectStore('recordings').put(rec);
    tx.oncomplete = () => resolve();
  });
}

function getAllRecordings() {
  return new Promise((resolve) => {
    const tx = db.transaction('recordings', 'readonly');
    const req = tx.objectStore('recordings').getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

/* ================= 2. СИСТЕМНІ СМУГИ (STATUS BAR) ================= */
const themeColorMeta = document.getElementById('theme-color-meta');
const statusBarStyleMeta = document.getElementById('status-bar-style-meta');

function setSystemBarsTheme(isDark) {
  const color = isDark ? '#000000' : '#ffffff';
  themeColorMeta.setAttribute('content', color);
  if (isDark) {
    document.body.classList.add('dark-mode');
    if (statusBarStyleMeta) statusBarStyleMeta.setAttribute('content', 'black-translucent');
  } else {
    document.body.classList.remove('dark-mode');
    if (statusBarStyleMeta) statusBarStyleMeta.setAttribute('content', 'default');
  }
  document.documentElement.style.backgroundColor = color;
  document.body.style.backgroundColor = color;
}

/* ================= 3. АЛГОРИТМ SRS ================= */
const INTERVALS = [
  0,
  4 * 60 * 60 * 1000,
  24 * 60 * 60 * 1000,
  3 * 24 * 60 * 60 * 1000,
  7 * 24 * 60 * 60 * 1000,
  30 * 24 * 60 * 60 * 1000
];

async function pickThreeWords() {
  const all = await getAllWords();
  if (all.length <= 3) return all;

  const now = Date.now();
  let pool = all.filter(w => (w.nextReview || 0) <= now);
  if (pool.length < 3) pool = [...all];

  // Сортуємо: рівень 0 (невикористані/нові) мають абсолютний пріоритет
  pool.sort((a, b) => (a.level - b.level) + (Math.random() - 0.5));
  return pool.slice(0, 3);
}

/* ================= 4. АУДІОЗАПИС ТА СИГНАЛ ================= */
let audioCtx = null;
let mediaRecorder = null;
let audioChunks = [];
let beepTimeout = null;
let maxLimitTimeout = null;

function playBeep() {
  try {
    const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, ctx.currentTime);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

async function startAudioRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.start();

    beepTimeout = setTimeout(() => playBeep(), 105 * 1000); // 1:45
    maxLimitTimeout = setTimeout(() => {
      if (appState === 'recording') stopSession();
    }, 120 * 1000); // 2:00
  } catch (err) {
    console.warn('Мікрофон недоступний', err);
  }
}

function stopAudioRecording() {
  clearTimeout(beepTimeout);
  clearTimeout(maxLimitTimeout);

  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      resolve(null);
      return;
    }
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

/* ================= 5. УПРАВЛІННЯ UI ТА ПЕРЕХОДАМИ ================= */
let appState = 'idle'; 
let currentWords = [];
let struckWordIds = new Set();
let lastRecordedBlob = null;

const track = document.getElementById('track');
const mainPage = document.getElementById('main-page');
const wordsContainer = document.getElementById('words-container');
const addWordOverlay = document.getElementById('add-word-overlay');
const newWordInput = document.getElementById('new-word-input');
const archiveList = document.getElementById('archive-list');

async function renderMainWords() {
  currentWords = await pickThreeWords();
  wordsContainer.innerHTML = '';
  currentWords.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word-item';
    el.dataset.id = w.id;
    el.textContent = w.text;
    wordsContainer.appendChild(el);
  });
}

async function startSession() {
  appState = 'recording';
  setSystemBarsTheme(true);
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await startAudioRecording();
}

async function stopSession() {
  lastRecordedBlob = await stopAudioRecording();
  appState = 'review';
  struckWordIds.clear();

  if (navigator.vibrate) navigator.vibrate(40);
  wordsContainer.classList.add('pulse-finish');
  setTimeout(() => wordsContainer.classList.remove('pulse-finish'), 150);
}

async function completeReviewAndRefresh() {
  for (const w of currentWords) {
    if (struckWordIds.has(w.id)) {
      w.level = Math.min((w.level || 0) + 1, 5);
      w.nextReview = Date.now() + INTERVALS[w.level];
    } else {
      w.level = 0;
      w.nextReview = Date.now();
    }
    await saveWord(w);
  }

  if (lastRecordedBlob) {
    await saveRecording({
      id: 'rec_' + Date.now(),
      date: new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' }),
      blob: lastRecordedBlob,
      words: currentWords.map(w => w.text)
    });
  }

  setSystemBarsTheme(false);
  appState = 'idle';
  await renderMainWords();
}

/* ================= 6. ДОДАВАННЯ СЛІВ ================= */
function openAddWord() {
  if (appState !== 'idle') return;
  appState = 'adding';
  wordsContainer.classList.add('dimmed');
  addWordOverlay.classList.add('active');
  newWordInput.value = '';
  newWordInput.focus();
}

async function closeAndSaveNewWord() {
  const text = newWordInput.value.trim().toLowerCase();
  if (text) {
    const parts = text.split(/[,+\n]/).map(s => s.trim()).filter(Boolean);
    for (const p of parts) {
      await saveWord({
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: p,
        level: 0,
        nextReview: 0,
        createdAt: Date.now()
      });
    }
  }
  newWordInput.blur();
  addWordOverlay.classList.remove('active');
  wordsContainer.classList.remove('dimmed');
  appState = 'idle';
  await renderMainWords();
}

/* ================= 7. БЕЗШОВНИЙ СЛОВНИК ================= */
async function renderArchiveList() {
  const words = await getAllWords();
  const recordings = await getAllRecordings();
  words.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  archiveList.innerHTML = '';
  words.forEach(w => {
    const item = document.createElement('div');
    item.className = 'archive-item';
    
    const matchedRecs = recordings.filter(r => r.words && r.words.includes(w.text));
    let recsHtml = '';
    matchedRecs.forEach(r => {
      recsHtml += `
        <div class="audio-row" data-id="${r.id}">
          <span class="play-icon">▶</span>
          <span class="rec-date">${r.date}</span>
        </div>
      `;
    });

    item.innerHTML = `
      <div class="archive-word">${w.text}</div>
      ${recsHtml ? `<div class="archive-recordings">${recsHtml}</div>` : ''}
    `;
    archiveList.appendChild(item);
  });

  archiveList.querySelectorAll('.audio-row').forEach(row => {
    row.onclick = () => {
      const rec = recordings.find(r => r.id === row.dataset.id);
      if (!rec || !rec.blob) return;

      const icon = row.querySelector('.play-icon');
      const audioUrl = URL.createObjectURL(rec.blob);
      const audio = new Audio(audioUrl);
      icon.textContent = '❚❚';
      audio.play();
      audio.onended = () => { icon.textContent = '▶'; };
    };
  });
}

function openArchive() {
  appState = 'archive';
  renderArchiveList();
  track.classList.add('show-archive');
}

function closeArchive() {
  track.classList.remove('show-archive');
  appState = 'idle';
}

/* ================= 8. ТАПИ ТА СВАЙПИ ================= */
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

window.addEventListener('touchend', async (e) => {
  const diffX = e.changedTouches[0].screenX - touchStartX;
  const diffY = e.changedTouches[0].screenY - touchStartY;
  const absX = Math.abs(diffX);
  const absY = Math.abs(diffY);

  // Свайп вниз на головному -> додати слово
  if (diffY > 45 && absY > absX && appState === 'idle') {
    openAddWord();
    return;
  }

  // Свайп вгору під час вводу -> зберегти
  if (diffY < -45 && absY > absX && appState === 'adding') {
    await closeAndSaveNewWord();
    return;
  }

  // Свайп вліво на головному -> плавний перехід у словник
  if (diffX < -50 && absX > absY && appState === 'idle') {
    openArchive();
    return;
  }

  // Свайп вправо у словнику -> плавне повернення
  if (diffX > 50 && absX > absY && appState === 'archive') {
    closeArchive();
    return;
  }
});

mainPage.addEventListener('click', async (e) => {
  if (appState === 'idle') {
    await startSession();
    return;
  }

  if (appState === 'recording') {
    await stopSession();
    return;
  }

  if (appState === 'review') {
    const wordEl = e.target.closest('.word-item');
    if (wordEl) {
      const id = wordEl.dataset.id;
      if (struckWordIds.has(id)) {
        struckWordIds.delete(id);
        wordEl.classList.remove('struck');
      } else {
        struckWordIds.add(id);
        wordEl.classList.add('struck');
      }
    } else {
      await completeReviewAndRefresh();
    }
  }
});

newWordInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    await closeAndSaveNewWord();
  }
});

/* ================= 9. РЕЄСТРАЦІЯ SERVICE WORKER ================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('SW failed:', err);
    });
  });
}

initDB().then(() => {
  renderMainWords();
});
</script>
</body>
</html>
