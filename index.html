<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Vocalize</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      color-scheme: light only;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #FAFAFA;
      color: #171717;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .card-transition {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }

    input, textarea {
      background-color: #FFFFFF !important;
      color: #171717 !important;
    }

    .swipe-content {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- TOP BAR (з відступом для Dynamic Island / чубчика) -->
  <header class="w-full px-6 pt-3 pb-3 flex justify-between items-center z-10 border-b border-neutral-200/60 bg-white/80 backdrop-blur-md">
    <div class="flex items-center gap-1 bg-neutral-100 p-1 rounded-full border border-neutral-200/50">
      <button id="tab-practice-btn" class="px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all bg-white text-neutral-950 shadow-sm">
        Практика <span id="queue-badge" class="ml-1 text-[10px] font-mono text-neutral-400">0</span>
      </button>
      <button id="tab-dictionary-btn" class="px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all text-neutral-500 hover:text-neutral-900">
        Словник <span id="dict-badge" class="ml-1 text-[10px] font-mono text-neutral-400">0</span>
      </button>
    </div>

    <button id="open-add-btn" class="w-9 h-9 flex items-center justify-center rounded-full border border-neutral-200 bg-white active:scale-90 transition-all text-neutral-800 hover:border-neutral-900">
      <i data-lucide="plus" class="w-4 h-4 stroke-[1.5]"></i>
    </button>
  </header>

  <!-- ================= VIEW 1: ПРАКТИКА ================= -->
  <main id="view-practice" class="flex-1 flex flex-col justify-between px-6 pb-12 pt-6 relative">
    
    <div class="flex-1 flex items-center justify-center">
      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center max-w-xs">
        <div class="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center mx-auto mb-3 text-neutral-400">
          <i data-lucide="check" class="w-4 h-4 stroke-[1.5]"></i>
        </div>
        <p class="text-sm font-normal text-neutral-900 mb-1">Все на сьогодні</p>
        <p class="text-xs text-neutral-400 mb-5">Черга порожня. Додай нові вирази або повтори через словник.</p>
        <button onclick="openModal()" class="px-5 py-2 rounded-full border border-neutral-900 text-neutral-900 text-xs font-medium active:scale-95 transition-all">
          + Додати слово
        </button>
      </div>

      <!-- Active Card -->
      <div id="card" class="card-transition w-full max-w-sm flex flex-col items-center text-center">
        <button id="tts-btn" title="Прослухати" class="text-neutral-400 hover:text-neutral-950 p-2 mb-3 active:scale-90 transition-all">
          <i data-lucide="volume-2" class="w-4 h-4 stroke-[1.5]"></i>
        </button>

        <h1 id="card-phrase" class="text-3xl sm:text-4xl font-light text-neutral-950 tracking-tight leading-tight mb-3">
          ...
        </h1>

        <p id="card-example" class="text-sm text-neutral-500 font-light leading-relaxed max-w-xs">
          ...
        </p>
      </div>
    </div>

    <!-- Controls -->
    <div class="w-full flex flex-col items-center">
      <!-- Режим запису: чорний круг -->
      <div id="record-controls" class="flex flex-col items-center">
        <div id="timer-display" class="text-[11px] font-mono text-neutral-400 mb-3 opacity-0 transition-opacity">00:00</div>
        <button id="mic-toggle-btn" class="w-16 h-16 rounded-full bg-neutral-950 flex items-center justify-center active:scale-90 transition-all shadow-md">
          <div id="record-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 opacity-0 transition-opacity"></div>
        </button>
      </div>

      <!-- Режим оцінки -->
      <div id="grade-controls" class="hidden w-full max-w-xs flex items-center justify-between gap-4">
        <button id="btn-again" class="flex-1 py-3.5 text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-900 transition-colors">
          ← Важко
        </button>

        <button id="btn-listen-self" title="Послухати свій запис" class="w-12 h-12 rounded-full bg-neutral-950 text-white flex items-center justify-center active:scale-90 transition-all flex-shrink-0 shadow-sm">
          <i data-lucide="play" class="w-4 h-4 fill-white translate-x-0.5"></i>
        </button>

        <button id="btn-good" class="flex-1 py-3.5 text-xs font-mono uppercase tracking-wider text-neutral-900 font-medium transition-colors">
          Легко →
        </button>
      </div>
    </div>

  </main>

  <!-- ================= VIEW 2: СЛОВНИК ================= -->
  <section id="view-dictionary" class="hidden flex-1 overflow-y-auto px-6 py-4 max-w-md w-full mx-auto">
    <!-- Search Bar -->
    <div class="relative mb-4">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 stroke-[1.5]"></i>
      <input type="text" id="dict-search" placeholder="Пошук виразів..." 
             class="w-full bg-white border border-neutral-200/80 rounded-xl pl-10 pr-4 py-2.5 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none focus:border-neutral-900 transition-all">
    </div>

    <!-- Список карток без червоних рамок -->
    <div id="dict-list" class="space-y-2.5 pb-8">
      <!-- Наповнюється динамічно -->
    </div>
  </section>

  <!-- ================= МОДАЛ ДОДАВАННЯ ================= -->
  <div id="add-modal" class="fixed inset-0 bg-neutral-900/10 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 sm:p-7 border border-neutral-200/80 shadow-2xl relative">
      <div class="flex justify-between items-center mb-6">
        <span class="text-[11px] font-mono uppercase tracking-wider text-neutral-400">Новий вираз</span>
        <button onclick="closeModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-neutral-400 hover:text-neutral-900 transition-colors">
          <i data-lucide="x" class="w-4 h-4 stroke-[1.5]"></i>
        </button>
      </div>

      <form id="add-form" class="space-y-4">
        <div>
          <input type="text" id="in-phrase" required placeholder="Слово або фраза" autocomplete="off"
                 class="w-full bg-white px-3.5 py-3 rounded-xl border border-neutral-200 text-sm font-normal text-neutral-900 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors">
        </div>

        <div>
          <textarea id="in-example" rows="2" placeholder="Приклад або контекст (опціонально)" autocomplete="off"
                    class="w-full bg-white px-3.5 py-2.5 rounded-xl border border-neutral-200 text-xs font-light text-neutral-700 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors resize-none"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-between">
          <span class="text-[10px] font-mono text-neutral-400">↵ Enter</span>
          <button type="submit" class="px-6 py-2.5 rounded-full bg-neutral-950 text-white text-xs font-medium tracking-wide active:scale-95 transition-all">
            Зберегти
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= JS ================= -->
  <script>
    const DB_NAME = 'vocalize_db_v4';
    let db;

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('cards')) {
            d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(); };
      });
    }

    async function getCards() {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readonly');
        const req = tx.objectStore('cards').getAll();
        req.onsuccess = () => res(req.result || []);
      });
    }

    async function saveCard(c) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(c);
        tx.oncomplete = () => res();
      });
    }

    async function deleteCard(id) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function seedInitial() {
      const cards = await getCards();
      if (cards.length === 0) {
        const defaults = [
          { phrase: "figure out", example: "I need some time to figure this out.", nextDue: 0, reps: 0 },
          { phrase: "cut corners", example: "Never cut corners on product safety.", nextDue: 0, reps: 0 },
          { phrase: "come up with", example: "We have to come up with a better solution.", nextDue: 0, reps: 0 }
        ];
        for (let d of defaults) await saveCard(d);
      }
    }

    /* Queue & State */
    let queue = [];
    let currentIndex = 0;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let lastAudioUrl = null;
    let timerInterval = null;
    let startTime = 0;

    async function initQueue() {
      const all = await getCards();
      const now = Date.now();
      queue = all.filter(c => (c.nextDue || 0) <= now);
      if (queue.length === 0 && all.length > 0) {
        queue = [all[Math.floor(Math.random() * all.length)]];
      }
      currentIndex = 0;
      updateUI();
      updateBadges(all.length, queue.length);
    }

    function updateBadges(total, due) {
      document.getElementById('dict-badge').textContent = total;
      document.getElementById('queue-badge').textContent = due;
    }

    function updateUI() {
      const empty = document.getElementById('empty-state');
      const card = document.getElementById('card');

      if (queue.length === 0 || currentIndex >= queue.length) {
        empty.classList.remove('hidden');
        card.classList.add('hidden');
        document.getElementById('record-controls').classList.add('hidden');
        document.getElementById('grade-controls').classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      card.classList.remove('hidden');
      document.getElementById('record-controls').classList.remove('hidden');
      document.getElementById('grade-controls').classList.add('hidden');

      const current = queue[currentIndex];
      document.getElementById('card-phrase').textContent = current.phrase;
      document.getElementById('card-example').textContent = current.example ? `“${current.example}”` : '';

      resetMicState();
    }

    function resetMicState() {
      isRecording = false;
      const btn = document.getElementById('mic-toggle-btn');
      const dot = document.getElementById('record-dot');
      btn.classList.remove('scale-105');
      dot.classList.add('opacity-0');
      document.getElementById('timer-display').classList.add('opacity-0');
      clearInterval(timerInterval);
    }

    /* Audio Recording */
    const micBtn = document.getElementById('mic-toggle-btn');
    const dot = document.getElementById('record-dot');
    const timerDisplay = document.getElementById('timer-display');

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          recordedChunks = [];
          mediaRecorder.ondataavailable = e => e.data.size > 0 && recordedChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            lastAudioUrl = URL.createObjectURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
          isRecording = true;

          micBtn.classList.add('scale-105');
          dot.classList.remove('opacity-0');
          
          startTime = Date.now();
          timerDisplay.classList.remove('opacity-0');
          timerInterval = setInterval(() => {
            const s = Math.floor((Date.now() - startTime) / 1000);
            timerDisplay.textContent = `00:${String(s).padStart(2, '0')}`;
          }, 500);

        } catch (e) {
          alert('Дозвольте мікрофон у браузері');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        clearInterval(timerInterval);
        isRecording = false;

        document.getElementById('record-controls').classList.add('hidden');
        document.getElementById('grade-controls').classList.remove('hidden');
        document.getElementById('grade-controls').classList.add('flex');
      }
    });

    /* Grading */
    async function handleGrade(success) {
      const current = queue[currentIndex];
      const cardEl = document.getElementById('card');

      cardEl.style.transform = success ? 'translateX(30px)' : 'translateX(-30px)';
      cardEl.style.opacity = '0';

      if (success) {
        current.reps = (current.reps || 0) + 1;
        current.nextDue = Date.now() + (current.reps === 1 ? 24 : current.reps * 48) * 3600 * 1000;
      } else {
        current.reps = 0;
        current.nextDue = Date.now() + 10 * 60 * 1000;
      }
      await saveCard(current);

      setTimeout(() => {
        currentIndex++;
        cardEl.style.transform = 'translateX(0)';
        cardEl.style.opacity = '1';
        updateUI();
      }, 180);
    }

    document.getElementById('btn-again').addEventListener('click', () => handleGrade(false));
    document.getElementById('btn-good').addEventListener('click', () => handleGrade(true));

    document.getElementById('btn-listen-self').addEventListener('click', () => {
      if (lastAudioUrl) new Audio(lastAudioUrl).play();
    });

    document.getElementById('tts-btn').addEventListener('click', () => {
      const current = queue[currentIndex];
      if (current && 'speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(current.phrase);
        u.lang = 'en-US';
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }
    });

    /* Navigation */
    const tabPracticeBtn = document.getElementById('tab-practice-btn');
    const tabDictBtn = document.getElementById('tab-dictionary-btn');
    const viewPractice = document.getElementById('view-practice');
    const viewDictionary = document.getElementById('view-dictionary');

    function switchTab(tab) {
      if (tab === 'practice') {
        viewPractice.classList.remove('hidden');
        viewDictionary.classList.add('hidden');

        tabPracticeBtn.className = "px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all bg-white text-neutral-950 shadow-sm";
        tabDictBtn.className = "px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all text-neutral-500 hover:text-neutral-900";
      } else {
        viewPractice.classList.add('hidden');
        viewDictionary.classList.remove('hidden');

        tabDictBtn.className = "px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all bg-white text-neutral-950 shadow-sm";
        tabPracticeBtn.className = "px-4 py-1.5 rounded-full text-xs font-medium tracking-wide transition-all text-neutral-500 hover:text-neutral-900";

        renderDictionary();
      }
    }

    tabPracticeBtn.addEventListener('click', () => switchTab('practice'));
    tabDictBtn.addEventListener('click', () => switchTab('dictionary'));

    /* ================= APPLE-STYLE SWIPE: БЕЗ ЧЕРВОНОГО ВИПЛИВАННЯ ================= */
    const dictList = document.getElementById('dict-list');
    const dictSearch = document.getElementById('dict-search');
    let currentlySwipedRow = null;

    async function renderDictionary(filter = '') {
      const all = await getCards();
      const filtered = all.filter(c => 
        c.phrase.toLowerCase().includes(filter.toLowerCase()) || 
        (c.example && c.example.toLowerCase().includes(filter.toLowerCase()))
      );

      dictList.innerHTML = '';

      if (filtered.length === 0) {
        dictList.innerHTML = `<div class="py-12 text-center text-xs font-mono text-neutral-400">Слів не знайдено</div>`;
        return;
      }

      filtered.forEach(card => {
        // Контейнер рядка: фоновий колір нейтральний (#FAFAFA), жодного червоного фону!
        const itemWrapper = document.createElement('div');
        itemWrapper.className = "relative overflow-hidden rounded-2xl select-none";
        
        itemWrapper.innerHTML = `
          <!-- Задня зона: тільки нейтральне тло та ЧЕРВОНА ІКОНКА СМІТНИКА -->
          <div class="absolute inset-y-0 right-0 w-[64px] flex items-center justify-center text-red-500 active:opacity-70 transition-opacity" data-delete-id="${card.id}">
            <i data-lucide="trash-2" class="w-5 h-5 text-red-500 stroke-[1.75]"></i>
          </div>

          <!-- Верхній шар: суцільна біла картка з акуратною сірою рамкою -->
          <div class="swipe-content relative bg-white border border-neutral-200/80 rounded-2xl px-4 py-3.5 flex items-center justify-between z-10">
            <div class="flex-1 min-w-0 pr-3 pointer-events-none">
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-medium text-neutral-950 truncate">${card.phrase}</h4>
                <span class="text-[9px] font-mono text-neutral-400 border border-neutral-200/80 rounded px-1.5 py-0.2">
                  ${card.reps || 0} повт
                </span>
              </div>
              ${card.example ? `<p class="text-xs text-neutral-500 font-light truncate mt-0.5">${card.example}</p>` : ''}
            </div>

            <button class="tts-dict-btn p-2 text-neutral-300 hover:text-neutral-900 active:scale-90 transition-all flex-shrink-0" data-phrase="${card.phrase}">
              <i data-lucide="volume-2" class="w-4 h-4 stroke-[1.5]"></i>
            </button>
          </div>
        `;

        dictList.appendChild(itemWrapper);
        initSwipeGesture(itemWrapper.querySelector('.swipe-content'), itemWrapper.querySelector('[data-delete-id]'), card.id);
      });

      lucide.createIcons();

      dictList.querySelectorAll('.tts-dict-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const phrase = btn.dataset.phrase;
          const u = new SpeechSynthesisUtterance(phrase);
          u.lang = 'en-US';
          speechSynthesis.speak(u);
        });
      });
    }

    function initSwipeGesture(cardContent, deleteBtn, cardId) {
      let startX = 0;
      let isSwiping = false;
      const threshold = 64; // Відстань свайпу під іконку

      function setTransform(x, transition = false) {
        cardContent.style.transition = transition ? 'transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)' : 'none';
        cardContent.style.transform = `translateX(${x}px)`;
      }

      cardContent.addEventListener('touchstart', (e) => {
        if (currentlySwipedRow && currentlySwipedRow !== cardContent) {
          currentlySwipedRow.style.transform = 'translateX(0px)';
          currentlySwipedRow = null;
        }
        startX = e.touches[0].clientX;
        isSwiping = true;
      }, { passive: true });

      cardContent.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        let diff = e.touches[0].clientX - startX;

        // Лише свайп ліворуч
        if (diff < 0) {
          if (diff < -threshold) {
            diff = -threshold + (diff + threshold) * 0.2; // легкий супротив
          }
          setTransform(diff, false);
        } else {
          setTransform(0, false);
        }
      }, { passive: true });

      cardContent.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        isSwiping = false;
        const diff = e.changedTouches[0].clientX - startX;

        if (diff < -threshold / 2) {
          setTransform(-threshold, true);
          currentlySwipedRow = cardContent;
        } else {
          setTransform(0, true);
          if (currentlySwipedRow === cardContent) currentlySwipedRow = null;
        }
      });

      // Тап по червоному смітнику -> видалення
      deleteBtn.addEventListener('click', async () => {
        const wrapper = cardContent.parentElement;
        wrapper.style.transition = 'all 0.2s cubic-bezier(0.16, 1, 0.3, 1)';
        wrapper.style.maxHeight = wrapper.offsetHeight + 'px';
        wrapper.style.opacity = '0';
        wrapper.style.transform = 'scale(0.95)';

        setTimeout(async () => {
          wrapper.style.maxHeight = '0px';
          wrapper.style.margin = '0px';
          wrapper.style.padding = '0px';

          setTimeout(async () => {
            await deleteCard(cardId);
            const allCards = await getCards();
            updateBadges(allCards.length, queue.length);
            await renderDictionary(dictSearch.value);
            await initQueue();
          }, 180);
        }, 120);
      });
    }

    // Закриття відкритого свайпу при кліку в іншому місці
    document.addEventListener('touchstart', (e) => {
      if (currentlySwipedRow && !currentlySwipedRow.contains(e.target) && !e.target.closest('[data-delete-id]')) {
        currentlySwipedRow.style.transform = 'translateX(0px)';
        currentlySwipedRow = null;
      }
    });

    dictSearch.addEventListener('input', (e) => {
      renderDictionary(e.target.value);
    });

    /* Modal Add */
    const modal = document.getElementById('add-modal');
    const inPhrase = document.getElementById('in-phrase');
    const inExample = document.getElementById('in-example');

    window.openModal = () => {
      modal.classList.remove('hidden');
      setTimeout(() => inPhrase.focus(), 60);
    };

    window.closeModal = () => modal.classList.add('hidden');
    document.getElementById('open-add-btn').addEventListener('click', openModal);

    inPhrase.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('add-form').requestSubmit();
      }
    });

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phrase = inPhrase.value.trim();
      const example = inExample.value.trim();
      if (!phrase) return;

      await saveCard({ phrase, example, nextDue: 0, reps: 0 });
      e.target.reset();
      closeModal();
      await initQueue();
      if (!viewDictionary.classList.contains('hidden')) {
        renderDictionary();
      }
    });

    /* Bootstrap */
    window.addEventListener('DOMContentLoaded', async () => {
      await openDB();
      await seedInitial();
      await initQueue();
      lucide.createIcons();
    });
  </script>
</body>
</html>
