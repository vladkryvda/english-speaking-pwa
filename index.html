<!DOCTYPE html>
<html lang="en" class="bg-[#FAFAFA]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vocalize">
  <meta name="theme-color" content="#FAFAFA" id="meta-theme-color">
  <title>Vocalize</title>
  
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    /* БЛОКУВАННЯ СКРОЛУ, ЗУМУ ТА ПРИХОВУВАННЯ СКРОЛБАРІВ */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-touch-callout: none;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      background-color: #FAFAFA;
      color: #171717;
      height: 100dvh;
      max-height: 100dvh;
      width: 100vw;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ФІКСАЦІЯ ПОРТРЕТНОЇ ОРІЄНТАЦІЇ */
    @media screen and (orientation: landscape) {
      body {
        transform: rotate(0deg);
      }
    }

    /* РЕЖИМ ЗАПИСУ: ЧИСТА OLED ТЕМРЯВА */
    body.is-recording {
      background-color: #000000 !important;
      color: #FFFFFF !important;
    }

    body.is-recording #prompt-question {
      color: #666666 !important;
      pointer-events: none !important;
    }

    body.is-recording .word-text {
      color: #FFFFFF !important;
    }

    body.is-recording .word-hint {
      color: #888888 !important;
    }

    body.is-recording #mic-btn {
      background-color: #000000 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
    }

    body.is-recording #stop-square {
      display: block !important;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Плавне розкриття прикладу */
    .word-hint {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease, margin 0.18s ease;
    }
    .word-hint.is-open {
      max-height: 80px;
      opacity: 1 !important;
      margin-top: 0.35rem;
    }

    /* Стан рефлексії на словах */
    .word-row.is-reflection.is-selected .word-text {
      text-decoration: line-through;
      color: #A3A3A3 !important;
    }

    /* АПАРАТНЕ 3D ПРИСКОРЕННЯ СВАЙПУ (120 FPS НА IPHONE) */
    .view-slider {
      will-change: transform;
      transform: translate3d(0, 0, 0);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Bottom Sheet додавання */
    #add-sheet {
      will-change: transform;
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="w-screen h-full relative overflow-hidden">

  <!-- ================= СЛАЙДЕР ЕКРАНІВ ================= -->
  <div id="view-slider" class="view-slider flex w-[200vw] h-full">

    <!-- ================= 1. ЕКРАН ПРАКТИКИ (АБСОЛЮТНИЙ МІНІМАЛІЗМ) ================= -->
    <section id="view-practice" class="w-screen h-full flex flex-col justify-between px-7 pb-8 pt-4 relative flex-shrink-0">
      
      <!-- ТЕМА СЦЕНАРІЮ (ТАП ПО НІЙ ЗМІНЮЄ ТЕМУ) -->
      <div id="scenario-container" class="w-full flex flex-col items-center text-center pt-2">
        <p id="prompt-question" title="Tap to change topic" class="text-xs sm:text-sm font-light text-neutral-400 leading-relaxed max-w-xs transition-opacity cursor-pointer active:opacity-40">
          Loading scenario...
        </p>
      </div>

      <!-- 3 ВЕЛИКІ СЛОВА В СТОВПЧИК -->
      <div id="words-container" class="flex-1 flex flex-col justify-center items-center space-y-8 sm:space-y-10 my-auto w-full">
        <!-- Генерується через JS -->
      </div>

      <!-- ПІДКАЗКА РЕФЛЕКСІЇ -->
      <div id="reflection-hint" class="hidden text-center text-[10px] font-mono uppercase tracking-widest text-neutral-400 mb-2">
        Tap words you used
      </div>

      <!-- НИЖНЯ ЗОНА ДІЇ -->
      <div id="action-zone" class="w-full flex flex-col items-center">
        
        <!-- Кнопка запису -->
        <button id="mic-btn" class="w-16 h-16 rounded-full bg-neutral-950 active:scale-90 transition-transform shadow-md flex items-center justify-center">
          <div id="stop-square" class="w-4 h-4 rounded-sm bg-white hidden"></div>
        </button>

        <!-- Елементи рефлексії на місці (Слухати + Пауза + Завершити) -->
        <div id="reflection-controls" class="hidden flex items-center gap-4">
          <button id="btn-play-self" title="Listen" class="w-12 h-12 rounded-full border border-neutral-200 bg-white flex items-center justify-center active:scale-90 transition-transform text-neutral-950">
            <!-- Іконка Play за замовчуванням -->
            <svg id="play-icon-svg" class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <!-- Іконка Pause (прихована) -->
            <svg id="pause-icon-svg" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>
          
          <button id="btn-done-reflection" class="px-7 py-3.5 rounded-full bg-neutral-950 text-white font-mono text-xs uppercase tracking-wider active:scale-95 transition-all shadow-sm">
            Done →
          </button>
        </div>

      </div>

    </section>

    <!-- ================= 2. БІБЛІОТЕКА (ВХІД ТІЛЬКИ ЧЕРЕЗ СВАЙП ВЛІВО) ================= -->
    <section id="view-library" class="w-screen h-full flex flex-col px-7 pb-8 pt-4 relative flex-shrink-0 bg-[#FAFAFA]">
      
      <!-- Верхній рядок Бібліотеки: Стрік зліва, Додати (+) справа -->
      <div class="w-full flex justify-between items-center mb-4 pt-1">
        <div class="flex items-center gap-1.5 text-[11px] font-mono text-neutral-500">
          <span>●</span>
          <span id="streak-count" class="font-medium text-neutral-950">0</span>
          <span class="text-[9px] text-neutral-400 uppercase tracking-wider">days streak</span>
        </div>

        <!-- Кнопка додавання слова (+) перенесена сюди -->
        <button id="open-add-btn" title="Add expression" class="p-1.5 text-neutral-400 hover:text-neutral-950 active:scale-90 transition-transform">
          <svg class="w-4 h-4" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="7" y1="2" x2="7" y2="12"></line>
            <line x1="2" y1="7" x2="12" y2="7"></line>
          </svg>
        </button>
      </div>

      <!-- Вкладки: Слова / Аудіо -->
      <div class="flex items-center gap-4 border-b border-neutral-200/80 pb-2 mb-3">
        <button id="subtab-words" class="text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors">
          Words (<span id="words-count">0</span>)
        </button>
        <button id="subtab-audio" class="text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors">
          Audio (<span id="audio-count">0</span>)
        </button>
      </div>

      <!-- Контент Бібліотеки -->
      <div id="library-content" class="flex-1 overflow-y-auto overscroll-y-contain space-y-2 pb-12"></div>

    </section>

  </div>

  <!-- ================= BOTTOM SHEET ДОДАВАННЯ СЛОВА ================= -->
  <div id="add-sheet-overlay" class="fixed inset-0 bg-neutral-950/20 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200 flex flex-col justify-end">
    <div id="add-sheet" class="w-full max-w-md mx-auto bg-white rounded-t-[32px] p-6 pt-3 shadow-2xl border-t border-neutral-100 translate-y-full">
      
      <div class="w-9 h-1 rounded-full bg-neutral-200 mx-auto mb-4 cursor-grab"></div>
      
      <div class="flex items-center justify-between mb-4">
        <span class="text-[10px] font-mono uppercase tracking-widest text-neutral-400">New Expression</span>
        <button id="close-sheet-btn" class="text-neutral-400 hover:text-neutral-900 text-xs font-mono p-1">Cancel</button>
      </div>

      <form id="add-sheet-form" class="space-y-4">
        <div>
          <input type="text" id="sheet-phrase" required placeholder="Word or expression" autocomplete="off"
                 class="w-full text-base font-normal text-neutral-950 placeholder-neutral-300 focus:outline-none border-b border-neutral-100 pb-2 bg-transparent">
        </div>

        <div>
          <input type="text" id="sheet-example" placeholder="Example context (optional)" autocomplete="off"
                 class="w-full text-xs font-light text-neutral-600 placeholder-neutral-300 focus:outline-none border-b border-neutral-100 pb-2 bg-transparent">
        </div>

        <div class="pt-2 flex items-center justify-between">
          <span class="text-[10px] font-mono text-neutral-400">↵ Enter to save</span>
          <button type="submit" class="px-6 py-2.5 rounded-full bg-neutral-950 text-white text-xs font-medium tracking-wide active:scale-95 transition-all">
            Save
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- ================= JS ENGINE ================= -->
  <script>
    /* 1. БАЗА ДАНИХ */
    const DB_NAME = 'vocalize_zen_v13';
    let db;

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
      });
    }

    async function getCards() {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readonly');
        const req = tx.objectStore('cards').getAll();
        req.onsuccess = () => res(req.result || []);
      });
    }

    async function saveCard(c) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(c);
        tx.oncomplete = () => res();
      });
    }

    async function deleteCard(id) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function getRecordings() {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readonly');
        const req = tx.objectStore('recordings').getAll();
        req.onsuccess = () => res((req.result || []).reverse());
      });
    }

    async function saveRecording(rec) {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readwrite');
        tx.objectStore('recordings').put(rec);
        tx.oncomplete = () => res();
      });
    }

    async function deleteRecording(id) {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readwrite');
        tx.objectStore('recordings').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function seedInitial() {
      const cards = await getCards();
      if (cards.length === 0) {
        const defaults = [
          { phrase: "figure out", example: "I need some time to figure this out.", nextDue: 0, reps: 0 },
          { phrase: "cut corners", example: "Never cut corners on product quality.", nextDue: 0, reps: 0 },
          { phrase: "come up with", example: "We have to come up with a better solution.", nextDue: 0, reps: 0 },
          { phrase: "call it a day", example: "Let's finish this task and call it a day.", nextDue: 0, reps: 0 },
          { phrase: "on the same page", example: "Let's make sure everyone is on the same page.", nextDue: 0, reps: 0 }
        ];
        for (let d of defaults) await saveCard(d);
      }
    }

    /* 2. ТАКТИЛЬНІСТЬ */
    function haptic(ms = 12) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    /* 3. СТРІК ТА PWA БЕЙДЖ */
    function getLocalDateStr(d = new Date()) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function updateStreakDisplay() {
      const history = JSON.parse(localStorage.getItem('vocalize_streak_history') || '[]');
      const todayStr = getLocalDateStr();
      const yesterdayStr = getLocalDateStr(new Date(Date.now() - 86400000));

      let streak = 0;
      let cur = new Date();
      if (!history.includes(todayStr) && history.includes(yesterdayStr)) {
        cur = new Date(Date.now() - 86400000);
      }

      while (history.includes(getLocalDateStr(cur))) {
        streak++;
        cur.setDate(cur.getDate() - 1);
      }

      document.getElementById('streak-count').textContent = streak;

      if ('setAppBadge' in navigator) {
        if (!history.includes(todayStr)) navigator.setAppBadge(1).catch(() => {});
        else navigator.clearAppBadge().catch(() => {});
      }
    }

    function markStreakToday() {
      const history = JSON.parse(localStorage.getItem('vocalize_streak_history') || '[]');
      const todayStr = getLocalDateStr();
      if (!history.includes(todayStr)) {
        history.push(todayStr);
        localStorage.setItem('vocalize_streak_history', JSON.stringify(history));
      }
      updateStreakDisplay();
    }

    /* 4. СЦЕНАРІЇ */
    const PROMPTS = [
      "What is something in your industry or daily routine that people overcomplicate?",
      "Describe a situation that went sideways and how you reacted.",
      "How would you handle a colleague who constantly misses deadlines?",
      "Talk about a tough decision you made where there was no perfect choice.",
      "Describe a time you took a calculated risk: what was at stake?",
      "How do you explain a complex technical problem to a beginner?",
      "Describe a situation where a shortcut caused a much bigger problem."
    ];

    /* 5. СТАН ДОДАТКУ */
    let currentTriad = [];
    let currentPrompt = "";
    let isRecording = false;
    let isReflectionMode = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let lastAudioBlob = null;
    let lastAudioUrl = null;
    let timerInterval = null;
    let startTime = 0;
    let chimePlayed = false;
    let wakeLock = null;
    let usedWordsMap = {};
    let activePlayerAudio = null;
    let recordMimeType = '';

    // Визначення нативного формату аудіо для iOS Safari
    function detectMimeType() {
      if (typeof MediaRecorder === 'undefined') return '';
      const candidates = ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'];
      for (let c of candidates) {
        if (MediaRecorder.isTypeSupported(c)) return c;
      }
      return '';
    }

    /* 6. ПРАКТИКА ТА ЗМІНА ТЕМИ ПО ТАПУ */
    async function initPracticeSession() {
      const all = await getCards();
      if (all.length < 3) return;

      const sorted = [...all].sort((a, b) => (a.nextDue || 0) - (b.nextDue || 0));
      currentTriad = sorted.slice(0, 3);
      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];

      document.getElementById('prompt-question').textContent = `“${currentPrompt}”`;

      const container = document.getElementById('words-container');
      container.innerHTML = '';
      usedWordsMap = {};

      currentTriad.forEach((card) => {
        usedWordsMap[card.id] = false;

        const row = document.createElement('div');
        row.className = "word-row flex flex-col items-center text-center select-none cursor-pointer";
        row.dataset.id = card.id;

        row.innerHTML = `
          <h2 class="word-text text-3xl sm:text-4xl font-light text-neutral-950 tracking-tight leading-tight transition-colors">
            ${card.phrase}
          </h2>
          ${card.example ? `<p class="word-hint text-xs text-neutral-400 font-light leading-relaxed max-w-[280px]">“${card.example}”</p>` : ''}
        `;

        row.addEventListener('click', () => {
          if (isReflectionMode) {
            haptic(8);
            usedWordsMap[card.id] = !usedWordsMap[card.id];
            row.classList.toggle('is-selected', usedWordsMap[card.id]);
          } else {
            haptic(6);
            const hint = row.querySelector('.word-hint');
            if (hint) hint.classList.toggle('is-open');
          }
        });

        container.appendChild(row);
      });

      exitReflectionMode();
    }

    // Тап по тексту теми змінює сценарій
    document.getElementById('prompt-question').addEventListener('click', () => {
      if (isRecording || isReflectionMode) return;
      haptic(10);
      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
      document.getElementById('prompt-question').textContent = `“${currentPrompt}”`;
    });

    /* 7. WAKE LOCK ТА 45с СИГНАЛ */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function play45sChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } catch (e) {}
    }

    /* 8. ЗАПИС АУДІО (БЕЗЗБІЙНИЙ IOS MP4 ЗАПИС) */
    const micBtn = document.getElementById('mic-btn');
    const metaThemeColor = document.getElementById('meta-theme-color');

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recordMimeType = detectMimeType();
          
          mediaRecorder = new MediaRecorder(stream, recordMimeType ? { mimeType: recordMimeType } : {});
          recordedChunks = [];
          chimePlayed = false;

          mediaRecorder.ondataavailable = e => e.data && e.data.size > 0 && recordedChunks.push(e.data);
          mediaRecorder.onstop = () => {
            lastAudioBlob = new Blob(recordedChunks, { type: recordMimeType || 'audio/mp4' });
            lastAudioUrl = URL.createObjectURL(lastAudioBlob);
            stream.getTracks().forEach(t => t.stop());
            enterReflectionMode();
          };

          mediaRecorder.start(250);
          isRecording = true;
          haptic(20);

          document.body.classList.add('is-recording');
          metaThemeColor.setAttribute('content', '#000000');
          await requestWakeLock();

          startTime = Date.now();
          timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            if (elapsed >= 45 && !chimePlayed) {
              play45sChime();
              chimePlayed = true;
            }
            if (elapsed >= 60) {
              stopRecording();
            }
          }, 500);

        } catch (e) {
          alert('Microphone access is required.');
          document.body.classList.remove('is-recording');
        }
      } else {
        stopRecording();
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
      clearInterval(timerInterval);
      releaseWakeLock();
      haptic(15);
      document.body.classList.remove('is-recording');
      metaThemeColor.setAttribute('content', '#FAFAFA');
    }

    /* 9. РЕФЛЕКСІЯ ТА СТАБІЛЬНИЙ ПЛЕЄР З ПАУЗОЮ */
    const playSvg = document.getElementById('play-icon-svg');
    const pauseSvg = document.getElementById('pause-icon-svg');

    function setPlayerVisualState(isPlaying) {
      if (isPlaying) {
        playSvg.classList.add('hidden');
        pauseSvg.classList.remove('hidden');
      } else {
        pauseSvg.classList.add('hidden');
        playSvg.classList.remove('hidden');
      }
    }

    function enterReflectionMode() {
      isReflectionMode = true;

      micBtn.classList.add('hidden');
      document.getElementById('reflection-controls').classList.remove('hidden');
      document.getElementById('reflection-controls').classList.add('flex');
      document.getElementById('reflection-hint').classList.remove('hidden');

      document.querySelectorAll('.word-row').forEach(row => {
        row.classList.add('is-reflection');
      });

      // Ініціалізація аудіо для iOS
      if (activePlayerAudio) {
        activePlayerAudio.pause();
        activePlayerAudio.src = '';
      }

      activePlayerAudio = new Audio();
      activePlayerAudio.src = lastAudioUrl;
      setPlayerVisualState(false);

      activePlayerAudio.onended = () => {
        setPlayerVisualState(false);
      };

      const playBtn = document.getElementById('btn-play-self');
      playBtn.onclick = () => {
        if (!activePlayerAudio) return;
        haptic(8);

        if (activePlayerAudio.paused) {
          activePlayerAudio.play().then(() => {
            setPlayerVisualState(true);
          }).catch(err => {
            console.error("Playback error:", err);
          });
        } else {
          activePlayerAudio.pause();
          setPlayerVisualState(false);
        }
      };
    }

    function exitReflectionMode() {
      isReflectionMode = false;
      if (activePlayerAudio) {
        activePlayerAudio.pause();
        activePlayerAudio.src = '';
      }
      setPlayerVisualState(false);

      micBtn.classList.remove('hidden');
      document.getElementById('reflection-controls').classList.add('hidden');
      document.getElementById('reflection-controls').classList.remove('flex');
      document.getElementById('reflection-hint').classList.add('hidden');
      
      document.querySelectorAll('.word-row').forEach(row => {
        row.classList.remove('is-reflection', 'is-selected');
      });
    }

    document.getElementById('btn-done-reflection').addEventListener('click', async () => {
      haptic([10, 40, 15]);
      if (activePlayerAudio) activePlayerAudio.pause();

      const durationSec = Math.max(1, Math.min(60, Math.floor((Date.now() - startTime) / 1000)));

      for (let card of currentTriad) {
        const wasUsed = usedWordsMap[card.id];
        if (wasUsed) {
          card.reps = (card.reps || 0) + 1;
          card.nextDue = Date.now() + (card.reps === 1 ? 24 : card.reps * 48) * 3600 * 1000;
        } else {
          card.reps = 0;
          card.nextDue = Date.now() + 10 * 60 * 1000;
        }
        await saveCard(card);
      }

      await saveRecording({
        prompt: currentPrompt,
        triadPhrases: currentTriad.map(c => ({ phrase: c.phrase, used: usedWordsMap[c.id] })),
        date: Date.now(),
        blob: lastAudioBlob,
        duration: durationSec
      });

      markStreakToday();
      await initPracticeSession();
    });

    /* 10. ШВИДКИЙ СВАЙП З АПАРАТНИМ ПРИСКОРЕННЯМ */
    const viewSlider = document.getElementById('view-slider');
    let currentTab = 'practice';

    function goToLibrary() {
      currentTab = 'library';
      viewSlider.style.transform = 'translate3d(-100vw, 0, 0)';
      renderLibrary();
    }

    function goToPractice() {
      currentTab = 'practice';
      viewSlider.style.transform = 'translate3d(0vw, 0, 0)';
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (isRecording || isAddSheetOpen) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.3 && elapsed < 550) {
        if (diffX < 0 && currentTab === 'practice') {
          goToLibrary();
        } else if (diffX > 0 && currentTab === 'library') {
          goToPractice();
        }
      }
    }, { passive: true });

    /* 11. БІБЛІОТЕКА */
    let libraryTab = 'words';
    const subtabWords = document.getElementById('subtab-words');
    const subtabAudio = document.getElementById('subtab-audio');
    const libraryContent = document.getElementById('library-content');

    subtabWords.addEventListener('click', () => {
      libraryTab = 'words';
      subtabWords.className = "text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors";
      subtabAudio.className = "text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors";
      renderLibrary();
    });

    subtabAudio.addEventListener('click', () => {
      libraryTab = 'audio';
      subtabAudio.className = "text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors";
      subtabWords.className = "text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors";
      renderLibrary();
    });

    async function renderLibrary() {
      const allCards = await getCards();
      const allRecs = await getRecordings();

      document.getElementById('words-count').textContent = allCards.length;
      document.getElementById('audio-count').textContent = allRecs.length;
      libraryContent.innerHTML = '';

      if (libraryTab === 'words') {
        if (allCards.length === 0) {
          libraryContent.innerHTML = `<div class="py-16 text-center text-xs font-mono text-neutral-400">Dictionary is empty</div>`;
          return;
        }

        allCards.forEach(card => {
          const item = document.createElement('div');
          item.className = "bg-white border border-neutral-200/80 rounded-2xl px-4 py-3 flex items-center justify-between shadow-sm";
          item.innerHTML = `
            <div class="flex-1 min-w-0 pr-3">
              <div class="text-sm font-medium text-neutral-950 truncate">${card.phrase}</div>
              ${card.example ? `<div class="text-xs text-neutral-400 font-light truncate mt-0.5">${card.example}</div>` : ''}
            </div>
            <button class="del-card-btn p-2 text-neutral-300 hover:text-red-500 transition-colors" data-id="${card.id}">
              <svg class="w-4 h-4 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          `;
          libraryContent.appendChild(item);

          item.querySelector('.del-card-btn').addEventListener('click', async () => {
            await deleteCard(card.id);
            await renderLibrary();
            await initPracticeSession();
          });
        });
      } else {
        if (allRecs.length === 0) {
          libraryContent.innerHTML = `<div class="py-16 text-center text-xs font-mono text-neutral-400">No audio notes yet</div>`;
          return;
        }

        allRecs.forEach(rec => {
          const item = document.createElement('div');
          item.className = "bg-white border border-neutral-200/80 rounded-2xl p-4 shadow-sm";
          const chips = (rec.triadPhrases || []).map(p => `
            <span class="text-[9px] font-mono px-2 py-0.5 rounded-md ${p.used ? 'bg-neutral-950 text-white' : 'border border-neutral-200 text-neutral-400'}">
              ${p.phrase}
            </span>
          `).join('');

          item.innerHTML = `
            <div class="text-xs font-medium text-neutral-950 mb-2 leading-snug">${rec.prompt || 'Spoken Thought'}</div>
            <div class="flex flex-wrap gap-1.5 mb-3">${chips}</div>
            <div class="flex items-center justify-between text-[10px] font-mono text-neutral-400 pt-2 border-t border-neutral-100">
              <span>${new Date(rec.date).toLocaleDateString([], { month: 'short', day: 'numeric' })} • ${rec.duration}s</span>
              <button class="del-rec-btn p-1 text-neutral-300 hover:text-red-500" data-id="${rec.id}">
                <svg class="w-3.5 h-3.5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;
          libraryContent.appendChild(item);

          item.querySelector('.del-rec-btn').addEventListener('click', async () => {
            await deleteRecording(rec.id);
            await renderLibrary();
          });
        });
      }
    }

    /* 12. ШВИДКА ШТОРКА ДОДАВАННЯ СЛІВ */
    const addOverlay = document.getElementById('add-sheet-overlay');
    const addSheet = document.getElementById('add-sheet');
    const sheetPhrase = document.getElementById('sheet-phrase');
    const sheetExample = document.getElementById('sheet-example');
    let isAddSheetOpen = false;

    function openAddSheet() {
      isAddSheetOpen = true;
      addOverlay.classList.remove('hidden');
      setTimeout(() => {
        addOverlay.classList.remove('opacity-0');
        addSheet.classList.remove('translate-y-full');
        sheetPhrase.focus();
      }, 10);
    }

    function closeAddSheet() {
      isAddSheetOpen = false;
      addSheet.classList.add('translate-y-full');
      addOverlay.classList.add('opacity-0');
      setTimeout(() => {
        addOverlay.classList.add('hidden');
        sheetPhrase.value = '';
        sheetExample.value = '';
      }, 240);
    }

    document.getElementById('open-add-btn').addEventListener('click', openAddSheet);
    document.getElementById('close-sheet-btn').addEventListener('click', closeAddSheet);

    addOverlay.addEventListener('click', (e) => {
      if (e.target === addOverlay) closeAddSheet();
    });

    document.getElementById('add-sheet-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phrase = sheetPhrase.value.trim();
      const example = sheetExample.value.trim();
      if (!phrase) return;

      haptic(15);
      await saveCard({ phrase, example, nextDue: 0, reps: 0 });
      closeAddSheet();
      await initPracticeSession();
      if (currentTab === 'library') renderLibrary();
    });

    /* 13. БЛОКУВАННЯ ЖЕСТІВ ЗУМУ ТА ПОВОРОТУ */
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => {
      if (e.scale !== undefined && e.scale !== 1) e.preventDefault();
    }, { passive: false });

    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(() => {});
    }

    /* 14. СТАРТ */
    window.addEventListener('DOMContentLoaded', async () => {
      await openDB();
      await seedInitial();
      updateStreakDisplay();
      await initPracticeSession();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
