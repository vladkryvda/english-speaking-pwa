<!DOCTYPE html>
<html lang="en" class="bg-[#FAFAFA]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Vocalize</title>
  
  <!-- PWA & Apple Status Bar Sync -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vocalize">
  <meta name="theme-color" content="#FAFAFA" id="meta-theme-color">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    html, body {
      background-color: #FAFAFA;
      color: #171717;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* РЕЖИМ ЗАПИСУ: ПОВНА OLED ТЕМРЯВА */
    body.is-recording {
      background-color: #000000 !important;
      color: #FFFFFF !important;
    }

    body.is-recording #top-bar,
    body.is-recording #btn-refresh-prompt,
    body.is-recording .word-hint {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body.is-recording #prompt-question {
      color: #666666 !important;
    }

    body.is-recording .word-text {
      color: #FFFFFF !important;
    }

    body.is-recording #mic-btn {
      background-color: #000000 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
    }

    body.is-recording #stop-square {
      display: block !important;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Плавне розкриття прихованого речення */
    .word-hint {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin 0.2s ease;
    }
    .word-hint.is-open {
      max-height: 60px;
      opacity: 1;
      margin-top: 0.35rem;
    }

    /* Інтерактивні слова у стані рефлексії */
    .word-row.is-reflection {
      cursor: pointer;
    }
    .word-row.is-reflection .word-text {
      transition: all 0.2s ease;
    }
    .word-row.is-reflection.is-selected .word-text {
      text-decoration: line-through;
      color: #A3A3A3 !important;
    }

    /* Переходи між практикою та бібліотекою (Swipe) */
    .view-slider {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #add-modal input, #add-modal textarea {
      background-color: #FFFFFF !important;
      color: #171717 !important;
    }
  </style>
</head>
<body class="w-screen h-full relative overflow-hidden">

  <!-- ================= ГОЛОВНИЙ КОНТЕЙНЕР (ГОРИЗОНТАЛЬНИЙ СВАЙП) ================= -->
  <div id="view-slider" class="view-slider flex w-[200vw] h-full">

    <!-- ================= 1. ЕКРАН ПРАКТИКИ (ЧИСТИЙ ДЗЕН) ================= -->
    <section id="view-practice" class="w-screen h-full flex flex-col justify-between px-7 pb-8 pt-3 relative flex-shrink-0">
      
      <!-- Мінімальний верхній рядок: лише ненав'язливий перехід у бібліотеку -->
      <div id="top-bar" class="w-full flex justify-between items-center z-10 transition-opacity duration-200">
        <button id="open-library-btn" title="Library (or swipe left)" class="text-xs font-mono text-neutral-300 hover:text-neutral-950 transition-colors py-1 flex items-center gap-1 active:scale-95">
          <span>Library</span>
          <span class="text-[10px]">→</span>
        </button>

        <button id="open-add-btn" title="Add expression" class="text-neutral-300 hover:text-neutral-950 transition-colors p-1 active:scale-90">
          <i data-lucide="plus" class="w-4 h-4 stroke-[1.5]"></i>
        </button>
      </div>

      <!-- ТЕМА СЦЕНАРІЮ (ТИХИЙ ШЕПІТ УГОРІ) -->
      <div id="scenario-container" class="w-full flex flex-col items-center text-center mt-2">
        <div class="flex items-center gap-2 group">
          <p id="prompt-question" class="text-xs sm:text-sm font-light text-neutral-400 leading-relaxed max-w-xs transition-colors">
            Loading scenario...
          </p>
          <button id="btn-refresh-prompt" title="Change scenario" class="text-neutral-300 hover:text-neutral-950 active:rotate-180 transition-all p-0.5">
            <i data-lucide="rotate-cw" class="w-3 h-3 stroke-[1.5]"></i>
          </button>
        </div>
      </div>

      <!-- 3 ВЕЛИКІ СЛОВА В СТОВПЧИК (БЕЗ НУМЕРАЦІЇ, ПРИКЛАД ВІДКРИВАЄТЬСЯ ПО ТАПУ) -->
      <div id="words-container" class="flex-1 flex flex-col justify-center items-center space-y-8 sm:space-y-10 my-auto w-full">
        <!-- 3 слова генеруються через JS -->
      </div>

      <!-- ПІДКАЗКА РЕФЛЕКСІЇ (З'являється тільки після запису) -->
      <div id="reflection-hint" class="hidden text-center text-[11px] font-mono uppercase tracking-widest text-neutral-400 mb-2">
        Tap words you used
      </div>

      <!-- НИЖНЯ ЗОНА ДІЇ (ЗАПИС АБО ЗБЕРЕЖЕННЯ РЕФЛЕКСІЇ) -->
      <div id="action-zone" class="w-full flex flex-col items-center">
        
        <!-- Стан 1: Кнопка запису -->
        <button id="mic-btn" class="w-16 h-16 rounded-full bg-neutral-950 active:scale-90 transition-all shadow-md flex items-center justify-center">
          <div id="stop-square" class="w-4 h-4 rounded-sm bg-white hidden"></div>
        </button>

        <!-- Стан 2: Елементи рефлексії на місці (Слухати + Завершити) -->
        <div id="reflection-controls" class="hidden flex items-center gap-4">
          <button id="btn-play-self" title="Listen" class="w-12 h-12 rounded-full border border-neutral-200 bg-white flex items-center justify-center active:scale-90 transition-transform">
            <i data-lucide="play" class="w-4 h-4 fill-neutral-950 text-neutral-950"></i>
          </button>
          <button id="btn-done-reflection" class="px-7 py-3.5 rounded-full bg-neutral-950 text-white font-mono text-xs uppercase tracking-wider active:scale-95 transition-all shadow-sm">
            Done →
          </button>
        </div>

      </div>

    </section>

    <!-- ================= 2. БІБЛІОТЕКА: СЛОВНИК + АРХІВ + СТРІК (СВАЙП ВЛІВО) ================= -->
    <section id="view-library" class="w-screen h-full flex flex-col px-7 pb-8 pt-3 relative flex-shrink-0 bg-[#FAFAFA]">
      
      <!-- Верхній рядок: повернення в практику -->
      <div class="w-full flex justify-between items-center mb-4">
        <button id="close-library-btn" class="text-xs font-mono text-neutral-400 hover:text-neutral-950 transition-colors py-1 flex items-center gap-1 active:scale-95">
          <span class="text-[10px]">←</span>
          <span>Practice</span>
        </button>

        <!-- МІНІМАЛІСТИЧНИЙ СТРІК ТУТ, ДЕ ЙОМУ МІСЦЕ -->
        <div class="flex items-center gap-1 text-[11px] font-mono text-neutral-500">
          <span id="streak-icon">●</span>
          <span id="streak-count">0</span>
          <span class="text-[9px] text-neutral-400 uppercase tracking-wider">days streak</span>
        </div>
      </div>

      <!-- Вкладки Бібліотеки: Слова / Записи -->
      <div class="flex items-center gap-4 border-b border-neutral-200/80 pb-2 mb-3">
        <button id="subtab-words" class="text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors">
          Words (<span id="words-count">0</span>)
        </button>
        <button id="subtab-audio" class="text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors">
          Audio Notes (<span id="audio-count">0</span>)
        </button>
      </div>

      <!-- Списки слів або аудіо -->
      <div id="library-content" class="flex-1 overflow-y-auto overscroll-y-contain space-y-2 pb-12">
        <!-- Контент слів або аудіо -->
      </div>

    </section>

  </div>

  <!-- ================= ADD MODAL ================= -->
  <div id="add-modal" class="fixed inset-0 bg-neutral-900/10 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 border border-neutral-200/80 shadow-2xl relative">
      <div class="flex justify-between items-center mb-5">
        <span class="text-[11px] font-mono uppercase tracking-wider text-neutral-400">New Expression</span>
        <button onclick="closeModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-neutral-400 hover:text-neutral-900">
          <i data-lucide="x" class="w-4 h-4 stroke-[1.5]"></i>
        </button>
      </div>

      <form id="add-form" class="space-y-4">
        <div>
          <input type="text" id="in-phrase" required placeholder="Word or phrase" autocomplete="off"
                 class="w-full bg-white px-3.5 py-3 rounded-xl border border-neutral-200 text-sm font-normal text-neutral-900 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors">
        </div>

        <div>
          <textarea id="in-example" rows="2" placeholder="Example sentence (optional)" autocomplete="off"
                    class="w-full bg-white px-3.5 py-2.5 rounded-xl border border-neutral-200 text-xs font-light text-neutral-700 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors resize-none"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end">
          <button type="submit" class="px-6 py-2.5 rounded-full bg-neutral-950 text-white text-xs font-medium tracking-wide active:scale-95 transition-all">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= JS ENGINE ================= -->
  <script>
    /* 1. DATABASE */
    const DB_NAME = 'vocalize_zen_v11';
    let db;

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
      });
    }

    async function getCards() {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readonly');
        const req = tx.objectStore('cards').getAll();
        req.onsuccess = () => res(req.result || []);
      });
    }

    async function saveCard(c) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(c);
        tx.oncomplete = () => res();
      });
    }

    async function deleteCard(id) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function getRecordings() {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readonly');
        const req = tx.objectStore('recordings').getAll();
        req.onsuccess = () => res((req.result || []).reverse());
      });
    }

    async function saveRecording(rec) {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readwrite');
        tx.objectStore('recordings').put(rec);
        tx.oncomplete = () => res();
      });
    }

    async function deleteRecording(id) {
      return new Promise(res => {
        const tx = db.transaction('recordings', 'readwrite');
        tx.objectStore('recordings').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function seedInitial() {
      const cards = await getCards();
      if (cards.length === 0) {
        const defaults = [
          { phrase: "figure out", example: "I need some time to figure this out.", nextDue: 0, reps: 0 },
          { phrase: "cut corners", example: "Never cut corners on product quality.", nextDue: 0, reps: 0 },
          { phrase: "come up with", example: "We have to come up with a better solution.", nextDue: 0, reps: 0 },
          { phrase: "call it a day", example: "Let's finish this task and call it a day.", nextDue: 0, reps: 0 },
          { phrase: "on the same page", example: "Let's make sure everyone is on the same page.", nextDue: 0, reps: 0 }
        ];
        for (let d of defaults) await saveCard(d);
      }
    }

    /* 2. HAPTICS (ТАКТИЛЬНИЙ ВІДГУК) */
    function haptic(ms = 12) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    /* 3. STREAK & APP BADGING (PWA) */
    function getLocalDateStr(d = new Date()) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function updateStreakDisplay() {
      const history = JSON.parse(localStorage.getItem('vocalize_streak_history') || '[]');
      const todayStr = getLocalDateStr();
      const yesterdayStr = getLocalDateStr(new Date(Date.now() - 86400000));

      let streak = 0;
      let cur = new Date();
      if (!history.includes(todayStr) && history.includes(yesterdayStr)) {
        cur = new Date(Date.now() - 86400000);
      }

      while (history.includes(getLocalDateStr(cur))) {
        streak++;
        cur.setDate(cur.getDate() - 1);
      }

      document.getElementById('streak-count').textContent = streak;
      
      // Бейдж на іконку PWA (якщо сьогодні ще не займався — бейдж 1)
      if ('setAppBadge' in navigator) {
        if (!history.includes(todayStr)) navigator.setAppBadge(1).catch(() => {});
        else navigator.clearAppBadge().catch(() => {});
      }
    }

    function markStreakToday() {
      const history = JSON.parse(localStorage.getItem('vocalize_streak_history') || '[]');
      const todayStr = getLocalDateStr();
      if (!history.includes(todayStr)) {
        history.push(todayStr);
        localStorage.setItem('vocalize_streak_history', JSON.stringify(history));
      }
      updateStreakDisplay();
    }

    /* 4. SCENARIOS */
    const PROMPTS = [
      "What is something in your industry or daily routine that people overcomplicate?",
      "Describe a situation that went sideways and how you reacted.",
      "How would you handle a colleague who constantly misses deadlines?",
      "Talk about a tough decision you made where there was no perfect choice.",
      "Describe a time you took a calculated risk: what was at stake?",
      "How do you explain a complex technical problem to a beginner?",
      "Describe a situation where a shortcut caused a much bigger problem."
    ];

    /* 5. APP STATE */
    let currentTriad = [];
    let currentPrompt = "";
    let isRecording = false;
    let isReflectionMode = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let lastAudioBlob = null;
    let lastAudioUrl = null;
    let timerInterval = null;
    let startTime = 0;
    let chimePlayed = false;
    let wakeLock = null;
    let usedWordsMap = {};
    let activePlayerAudio = null;

    /* 6. PRACTICE INITIALIZATION */
    async function initPracticeSession() {
      const all = await getCards();
      if (all.length < 3) return;

      const sorted = [...all].sort((a, b) => (a.nextDue || 0) - (b.nextDue || 0));
      currentTriad = sorted.slice(0, 3);
      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];

      document.getElementById('prompt-question').textContent = `“${currentPrompt}”`;

      // 3 ЧИСТІ СЛОВА В СТОВПЧИК (ПРИКЛАД ВІДКРИВАЄТЬСЯ ПО ТАПУ)
      const container = document.getElementById('words-container');
      container.innerHTML = '';
      usedWordsMap = {};

      currentTriad.forEach((card, index) => {
        usedWordsMap[card.id] = false;

        const row = document.createElement('div');
        row.className = "word-row flex flex-col items-center text-center select-none";
        row.dataset.id = card.id;

        row.innerHTML = `
          <h2 class="word-text text-3xl sm:text-4xl font-light text-neutral-950 tracking-tight leading-tight transition-colors">
            ${card.phrase}
          </h2>
          ${card.example ? `<p class="word-hint text-xs text-neutral-400 font-light leading-relaxed max-w-[280px]">“${card.example}”</p>` : ''}
        `;

        // У звичайному стані тап відкриває/ховає приклад
        row.addEventListener('click', () => {
          if (isReflectionMode) {
            // У стані рефлексії тап відмічає слово
            haptic(8);
            usedWordsMap[card.id] = !usedWordsMap[card.id];
            row.classList.toggle('is-selected', usedWordsMap[card.id]);
          } else if (!isRecording) {
            // У спокої тап розгортає приклад
            const hint = row.querySelector('.word-hint');
            if (hint) hint.classList.toggle('is-open');
          }
        });

        container.appendChild(row);
      });

      exitReflectionMode();
    }

    document.getElementById('btn-refresh-prompt').addEventListener('click', () => {
      if (isRecording) return;
      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
      document.getElementById('prompt-question').textContent = `“${currentPrompt}”`;
    });

    /* 7. WAKE LOCK & 45s CHIME */
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function play45sChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } catch (e) {}
    }

    /* 8. RECORDING ENGINE */
    const micBtn = document.getElementById('mic-btn');
    const metaThemeColor = document.getElementById('meta-theme-color');

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          recordedChunks = [];
          chimePlayed = false;

          mediaRecorder.ondataavailable = e => e.data.size > 0 && recordedChunks.push(e.data);
          mediaRecorder.onstop = () => {
            lastAudioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
            lastAudioUrl = URL.createObjectURL(lastAudioBlob);
            stream.getTracks().forEach(t => t.stop());
            enterReflectionMode();
          };

          mediaRecorder.start();
          isRecording = true;
          haptic(20);

          // ДЗЕН-РЕЖИМ OLED
          document.body.classList.add('is-recording');
          metaThemeColor.setAttribute('content', '#000000');
          await requestWakeLock();

          startTime = Date.now();
          timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            if (elapsed >= 45 && !chimePlayed) {
              play45sChime();
              chimePlayed = true;
            }
            if (elapsed >= 60) {
              stopRecording();
            }
          }, 500);

        } catch (e) {
          alert('Microphone access is required.');
          document.body.classList.remove('is-recording');
        }
      } else {
        stopRecording();
      }
    });

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
      clearInterval(timerInterval);
      releaseWakeLock();
      haptic(15);
      document.body.classList.remove('is-recording');
      metaThemeColor.setAttribute('content', '#FAFAFA');
    }

    /* 9. IN-PLACE REFLECTION (РЕФЛЕКСІЯ ПРЯМО ТУТ) */
    function enterReflectionMode() {
      isReflectionMode = true;

      // Ховаємо кнопку запису, показуємо контролери рефлексії
      micBtn.classList.add('hidden');
      document.getElementById('reflection-controls').classList.remove('hidden');
      document.getElementById('reflection-controls').classList.add('flex');
      document.getElementById('reflection-hint').classList.remove('hidden');

      // Слова отримують статус інтерактивних
      document.querySelectorAll('.word-row').forEach(row => {
        row.classList.add('is-reflection');
      });

      // Скидання плеєра
      if (activePlayerAudio) activePlayerAudio.pause();
      activePlayerAudio = new Audio(lastAudioUrl);
      const playBtn = document.getElementById('btn-play-self');
      playBtn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-neutral-950 text-neutral-950"></i>`;
      lucide.createIcons();

      playBtn.onclick = () => {
        if (activePlayerAudio.paused) {
          activePlayerAudio.play();
          playBtn.innerHTML = `<i data-lucide="square" class="w-3.5 h-3.5 fill-neutral-950 text-neutral-950"></i>`;
          activePlayerAudio.onended = () => {
            playBtn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-neutral-950 text-neutral-950"></i>`;
            lucide.createIcons();
          };
        } else {
          activePlayerAudio.pause();
          playBtn.innerHTML = `<i data-lucide="play" class="w-4 h-4 fill-neutral-950 text-neutral-950"></i>`;
        }
        lucide.createIcons();
      };
    }

    function exitReflectionMode() {
      isReflectionMode = false;
      micBtn.classList.remove('hidden');
      document.getElementById('reflection-controls').classList.add('hidden');
      document.getElementById('reflection-controls').classList.remove('flex');
      document.getElementById('reflection-hint').classList.add('hidden');
      document.querySelectorAll('.word-row').forEach(row => {
        row.classList.remove('is-reflection', 'is-selected');
      });
    }

    document.getElementById('btn-done-reflection').addEventListener('click', async () => {
      haptic([10, 40, 15]);
      if (activePlayerAudio) activePlayerAudio.pause();

      const durationSec = Math.max(1, Math.min(60, Math.floor((Date.now() - startTime) / 1000)));

      // Оновлюємо інтервали слів
      for (let card of currentTriad) {
        const wasUsed = usedWordsMap[card.id];
        if (wasUsed) {
          card.reps = (card.reps || 0) + 1;
          card.nextDue = Date.now() + (card.reps === 1 ? 24 : card.reps * 48) * 3600 * 1000;
        } else {
          card.reps = 0;
          card.nextDue = Date.now() + 10 * 60 * 1000;
        }
        await saveCard(card);
      }

      // Зберігаємо в аудіо-нотатки
      await saveRecording({
        prompt: currentPrompt,
        triadPhrases: currentTriad.map(c => ({ phrase: c.phrase, used: usedWordsMap[c.id] })),
        date: Date.now(),
        blob: lastAudioBlob,
        duration: durationSec
      });

      markStreakToday();
      await initPracticeSession();
    });

    /* 10. SWIPE GESTURES & LIBRARY TRANSITION */
    const viewSlider = document.getElementById('view-slider');
    let currentTab = 'practice'; // 'practice' or 'library'

    function goToLibrary() {
      currentTab = 'library';
      viewSlider.style.transform = 'translateX(-100vw)';
      renderLibrary();
    }

    function goToPractice() {
      currentTab = 'practice';
      viewSlider.style.transform = 'translateX(0vw)';
    }

    document.getElementById('open-library-btn').addEventListener('click', goToLibrary);
    document.getElementById('close-library-btn').addEventListener('click', goToPractice);

    // Свайп жести
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (isRecording) return;
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;

      // Горизонтальний свайп (без випадкового скролу)
      if (Math.abs(diffX) > 60 && Math.abs(diffY) < 50) {
        if (diffX < 0 && currentTab === 'practice') {
          goToLibrary(); // Свайп вліво -> Бібліотека
        } else if (diffX > 0 && currentTab === 'library') {
          goToPractice(); // Свайп вправо -> Практика
        }
      }
    });

    /* 11. LIBRARY ENGINE (WORDS + AUDIO NOTES) */
    let libraryTab = 'words'; // 'words' or 'audio'

    const subtabWords = document.getElementById('subtab-words');
    const subtabAudio = document.getElementById('subtab-audio');
    const libraryContent = document.getElementById('library-content');

    subtabWords.addEventListener('click', () => {
      libraryTab = 'words';
      subtabWords.className = "text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors";
      subtabAudio.className = "text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors";
      renderLibrary();
    });

    subtabAudio.addEventListener('click', () => {
      libraryTab = 'audio';
      subtabAudio.className = "text-xs font-mono uppercase tracking-wider font-medium text-neutral-950 transition-colors";
      subtabWords.className = "text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-950 transition-colors";
      renderLibrary();
    });

    async function renderLibrary() {
      const allCards = await getCards();
      const allRecs = await getRecordings();

      document.getElementById('words-count').textContent = allCards.length;
      document.getElementById('audio-count').textContent = allRecs.length;
      libraryContent.innerHTML = '';

      if (libraryTab === 'words') {
        if (allCards.length === 0) {
          libraryContent.innerHTML = `<div class="py-16 text-center text-xs font-mono text-neutral-400">Dictionary is empty</div>`;
          return;
        }

        allCards.forEach(card => {
          const item = document.createElement('div');
          item.className = "bg-white border border-neutral-200/80 rounded-2xl px-4 py-3 flex items-center justify-between shadow-sm";
          item.innerHTML = `
            <div class="flex-1 min-w-0 pr-3">
              <div class="text-sm font-medium text-neutral-950 truncate">${card.phrase}</div>
              ${card.example ? `<div class="text-xs text-neutral-400 font-light truncate mt-0.5">${card.example}</div>` : ''}
            </div>
            <button class="del-card-btn p-2 text-neutral-300 hover:text-red-500 transition-colors" data-id="${card.id}">
              <i data-lucide="trash-2" class="w-4 h-4 stroke-[1.5]"></i>
            </button>
          `;
          libraryContent.appendChild(item);

          item.querySelector('.del-card-btn').addEventListener('click', async () => {
            await deleteCard(card.id);
            await renderLibrary();
            await initPracticeSession();
          });
        });
      } else {
        if (allRecs.length === 0) {
          libraryContent.innerHTML = `<div class="py-16 text-center text-xs font-mono text-neutral-400">No audio notes yet</div>`;
          return;
        }

        allRecs.forEach(rec => {
          const item = document.createElement('div');
          item.className = "bg-white border border-neutral-200/80 rounded-2xl p-4 shadow-sm";
          const chips = (rec.triadPhrases || []).map(p => `
            <span class="text-[9px] font-mono px-2 py-0.5 rounded-md ${p.used ? 'bg-neutral-950 text-white' : 'border border-neutral-200 text-neutral-400'}">
              ${p.phrase}
            </span>
          `).join('');

          item.innerHTML = `
            <div class="text-xs font-medium text-neutral-950 mb-2 leading-snug">${rec.prompt || 'Spoken Thought'}</div>
            <div class="flex flex-wrap gap-1.5 mb-3">${chips}</div>
            <div class="flex items-center justify-between text-[10px] font-mono text-neutral-400 pt-2 border-t border-neutral-100">
              <span>${new Date(rec.date).toLocaleDateString([], { month: 'short', day: 'numeric' })} • ${rec.duration}s</span>
              <button class="del-rec-btn p-1 text-neutral-300 hover:text-red-500" data-id="${rec.id}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 stroke-[1.5]"></i>
              </button>
            </div>
          `;
          libraryContent.appendChild(item);

          item.querySelector('.del-rec-btn').addEventListener('click', async () => {
            await deleteRecording(rec.id);
            await renderLibrary();
          });
        });
      }

      lucide.createIcons();
    }

    /* 12. ADD EXPRESSION MODAL */
    const modal = document.getElementById('add-modal');
    const inPhrase = document.getElementById('in-phrase');
    const inExample = document.getElementById('in-example');

    window.openModal = () => {
      modal.classList.remove('hidden');
      setTimeout(() => inPhrase.focus(), 60);
    };

    window.closeModal = () => modal.classList.add('hidden');
    document.getElementById('open-add-btn').addEventListener('click', openModal);

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phrase = inPhrase.value.trim();
      const example = inExample.value.trim();
      if (!phrase) return;

      await saveCard({ phrase, example, nextDue: 0, reps: 0 });
      e.target.reset();
      closeModal();
      await initPracticeSession();
      if (currentTab === 'library') renderLibrary();
    });

    /* 13. BOOTSTRAP */
    window.addEventListener('DOMContentLoaded', async () => {
      await openDB();
      await seedInitial();
      updateStreakDisplay();
      await initPracticeSession();
      lucide.createIcons();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
