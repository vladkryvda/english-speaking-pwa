<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Speaking SRS</title>
  <style>
    /* ================= БАЗОВІ СТИЛІ ТА ШРИФТ ================= */
    :root {
      --bg-white: #ffffff;
      --text-black: #111111;
      --bg-black: #161616;
      --text-white: #f5f5f5;
      --dim-opacity: 0.15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-white);
      font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', 'Liberation Mono', Menlo, Monaco, Consolas, monospace;
      overscroll-behavior: none;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ================= ЕКРАНИ (VIEWS) ================= */
    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-color 0.3s ease, transform 0.25s ease-out;
    }

    /* Головний екран */
    #main-view {
      background-color: var(--bg-white);
      color: var(--text-black);
      z-index: 10;
    }

    #main-view.recording-mode,
    #main-view.review-mode {
      background-color: var(--bg-black);
      color: var(--text-white);
    }

    /* Контейнер слів на головному */
    .words-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.8rem;
      width: 100%;
      transition: opacity 0.2s ease;
    }

    .word-item {
      font-size: 2.3rem;
      font-weight: 500;
      letter-spacing: -0.5px;
      cursor: pointer;
      position: relative;
      transition: opacity 0.2s ease;
    }

    /* Стан закресленого слова */
    .word-item.struck {
      text-decoration: line-through;
      text-decoration-thickness: 3.5px;
      opacity: 0.85;
    }

    /* ================= ПОЛЕ ДОДАВАННЯ СЛОВА ================= */
    #add-word-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    #add-word-overlay.active {
      display: flex;
    }

    .new-word-input {
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 2.3rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-black);
      width: 85%;
      caret-color: var(--text-black);
    }

    .new-word-input::placeholder {
      color: rgba(0, 0, 0, 0.25);
    }

    /* Притемнення фонових слів під час введення */
    .words-container.dimmed {
      opacity: var(--dim-opacity);
    }

    /* ================= АРХІВ + СЛОВНИК ================= */
    #archive-view {
      background-color: var(--bg-white);
      color: var(--text-black);
      transform: translateX(-100%);
      z-index: 30;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 4rem 2rem 2rem 2rem;
      overflow-y: auto;
      user-select: auto;
    }

    #archive-view.active {
      transform: translateX(0);
    }

    .archive-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 2rem;
      opacity: 0.4;
      text-transform: lowercase;
    }

    .archive-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .archive-item {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      padding-bottom: 1rem;
    }

    .archive-word {
      font-size: 1.4rem;
      font-weight: 500;
    }

    .archive-recordings {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .audio-player-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .play-btn {
      cursor: pointer;
      font-size: 1rem;
      width: 24px;
      display: inline-block;
    }

    .progress-bar {
      flex: 1;
      height: 2px;
      background: #111;
      position: relative;
    }

    .date-label {
      font-size: 0.75rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ГОЛОВНИЙ ЕКРАН (ТАКОЖ СТАНИ: ЗАПИС, ПІДБИТТЯ ПІДСУМКІВ) -->
  <div id="main-view" class="view">
    <div class="words-container" id="words-container"></div>
    
    <!-- Поле швидкого вводу нового слова -->
    <div id="add-word-overlay">
      <input type="text" id="new-word-input" class="new-word-input" placeholder="new word" autocomplete="off" autocapitalize="none" spellcheck="false" />
    </div>
  </div>

  <!-- ЕКРАН: СЛОВНИК + АРХІВ -->
  <div id="archive-view" class="view">
    <div class="archive-title">словник + архів записів</div>
    <div class="archive-list" id="archive-list"></div>
  </div>
</div>

<script>
/* ================= 1. БАЗА ДАНИХ (INDEXEDDB) ================= */
const DB_NAME = 'MinimalSRS_DB';
const DB_VERSION = 1;
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('words')) {
        const wordStore = db.createObjectStore('words', { keyPath: 'id' });
        wordStore.createIndex('level', 'level', { unique: false });
        wordStore.createIndex('nextReview', 'nextReview', { unique: false });
      }
      if (!db.objectStoreNames.contains('recordings')) {
        db.createObjectStore('recordings', { keyPath: 'id' });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      seedInitialWords().then(resolve);
    };
    request.onerror = (e) => reject(e);
  });
}

// Початкові слова, якщо база зовсім порожня
async function seedInitialWords() {
  const words = await getAllWords();
  if (words.length === 0) {
    const initialList = ['whatever', 'sometimes', 'frank', 'creep', 'freak', 'candid'];
    for (const text of initialList) {
      await saveWord({
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: text.toLowerCase(),
        level: 0,
        nextReview: 0,
        createdAt: Date.now()
      });
    }
  }
}

function getAllWords() {
  return new Promise((resolve) => {
    const tx = db.transaction('words', 'readonly');
    const store = tx.objectStore('words');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

function saveWord(word) {
  return new Promise((resolve) => {
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').put(word);
    tx.oncomplete = () => resolve();
  });
}

function saveRecording(rec) {
  return new Promise((resolve) => {
    const tx = db.transaction('recordings', 'readwrite');
    tx.objectStore('recordings').put(rec);
    tx.oncomplete = () => resolve();
  });
}

function getAllRecordings() {
  return new Promise((resolve) => {
    const tx = db.transaction('recordings', 'readonly');
    const store = tx.objectStore('recordings');
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

/* ================= 2. АЛГОРИТМ РОТАЦІЇ СЛІВ (SRS) ================= */
// Інтервали за рівнями: Рівень 0 (одразу), 1 (4 год), 2 (1 день), 3 (3 дні), 4 (7 днів), 5 (30 днів)
const INTERVALS = [
  0,
  4 * 60 * 60 * 1000,
  24 * 60 * 60 * 1000,
  3 * 24 * 60 * 60 * 1000,
  7 * 24 * 60 * 60 * 1000,
  30 * 24 * 60 * 60 * 1000
];

async function pickThreeWords() {
  const all = await getAllWords();
  if (all.length <= 3) return all;

  const now = Date.now();
  // Ті, яким настав час повторення
  let readyPool = all.filter(w => (w.nextReview || 0) <= now);
  if (readyPool.length < 3) readyPool = [...all];

  // Сортуємо: спочатку менший рівень + рандомізація
  readyPool.sort((a, b) => (a.level - b.level) + (Math.random() - 0.5));
  return readyPool.slice(0, 3);
}

/* ================= 3. ЗВУК ТА АУДІОЗАПИС ================= */
let audioCtx = null;
let mediaRecorder = null;
let audioChunks = [];
let recordingStartTime = 0;
let beepTimeout = null;
let maxLimitTimeout = null;

// Звуковий сигнал на 1:45 через Web Audio (працює без зовнішніх файлів)
function playBeep() {
  try {
    const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // нота D5
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {
    console.warn('AudioContext not allowed yet', e);
  }
}

async function startAudioRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.start();
    recordingStartTime = Date.now();

    // Сигнал на 1 хв 45 сек (105 000 мс)
    beepTimeout = setTimeout(() => {
      playBeep();
    }, 105 * 1000);

    // Авто-завершення на 2:00 (120 000 мс)
    maxLimitTimeout = setTimeout(() => {
      if (appState === 'recording') stopSession();
    }, 120 * 1000);

  } catch (err) {
    console.warn('Мікрофон недоступний або відхилено:', err);
  }
}

function stopAudioRecording() {
  clearTimeout(beepTimeout);
  clearTimeout(maxLimitTimeout);

  return new Promise((resolve) => {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      resolve(null);
      return;
    }
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      // Зупиняємо всі аудіодоріжки
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

/* ================= 4. КЕРУВАННЯ СТАНОМ ТА UI ================= */
// Стан додатку: 'idle' | 'adding' | 'recording' | 'review' | 'archive'
let appState = 'idle';
let currentWords = [];
let struckWordIds = new Set();
let lastRecordedBlob = null;

const mainView = document.getElementById('main-view');
const wordsContainer = document.getElementById('words-container');
const addWordOverlay = document.getElementById('add-word-overlay');
const newWordInput = document.getElementById('new-word-input');
const archiveView = document.getElementById('archive-view');
const archiveList = document.getElementById('archive-list');

async function renderMainWords() {
  currentWords = await pickThreeWords();
  wordsContainer.innerHTML = '';
  currentWords.forEach(w => {
    const el = document.createElement('div');
    el.className = 'word-item';
    el.dataset.id = w.id;
    el.textContent = w.text;
    wordsContainer.appendChild(el);
  });
}

// Запуск сесії запису
async function startSession() {
  appState = 'recording';
  mainView.className = 'view recording-mode';
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await startAudioRecording();
}

// Зупинка сесії -> перехід до викреслювання
async function stopSession() {
  lastRecordedBlob = await stopAudioRecording();
  appState = 'review';
  struckWordIds.clear();
  mainView.className = 'view review-mode';
}

// Завершення підсумків сесії -> перехід на новий білий екран
async function completeReviewAndRefresh() {
  // Оновлюємо рівні в базі SRS
  for (const w of currentWords) {
    if (struckWordIds.has(w.id)) {
      // Слово вжито -> +1 рівень
      w.level = Math.min((w.level || 0) + 1, 5);
      w.nextReview = Date.now() + INTERVALS[w.level];
    } else {
      // Слово пропущено -> скидаємо на 0
      w.level = 0;
      w.nextReview = Date.now();
    }
    await saveWord(w);
  }

  // Зберігаємо запис аудіо в архів
  if (lastRecordedBlob) {
    await saveRecording({
      id: 'rec_' + Date.now(),
      date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      blob: lastRecordedBlob,
      words: currentWords.map(w => w.text)
    });
  }

  // Повертаємося до стану очікування
  appState = 'idle';
  mainView.className = 'view';
  await renderMainWords();
}

/* ================= 5. ДОДАВАННЯ СЛІВ (СВАЙП ВНИЗ) ================= */
function openAddWord() {
  if (appState !== 'idle') return;
  appState = 'adding';
  wordsContainer.classList.add('dimmed');
  addWordOverlay.classList.add('active');
  newWordInput.value = '';
  newWordInput.focus();
}

async function closeAndSaveNewWord() {
  const text = newWordInput.value.trim().toLowerCase();
  if (text) {
    // Підтримка кількох слів через кому
    const parts = text.split(/[,+\n]/).map(s => s.trim()).filter(Boolean);
    for (const p of parts) {
      await saveWord({
        id: 'w_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: p,
        level: 0,
        nextReview: 0,
        createdAt: Date.now()
      });
    }
  }
  newWordInput.blur();
  addWordOverlay.classList.remove('active');
  wordsContainer.classList.remove('dimmed');
  appState = 'idle';
  await renderMainWords();
}

/* ================= 6. ВІДОБРАЖЕННЯ АРХІВУ ================= */
async function openArchive() {
  appState = 'archive';
  archiveView.classList.add('active');
  
  const words = await getAllWords();
  const recordings = await getAllRecordings();
  words.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  archiveList.innerHTML = '';
  words.forEach(w => {
    const item = document.createElement('div');
    item.className = 'archive-item';
    
    // Знаходимо записи, де було це слово
    const matchedRecs = recordings.filter(r => r.words && r.words.includes(w.text));

    let recsHtml = '';
    matchedRecs.forEach(r => {
      recsHtml += `
        <div class="audio-player-row">
          <span class="play-btn" data-id="${r.id}">▶</span>
          <div class="progress-bar"></div>
          <span class="date-label">${r.date}</span>
        </div>
      `;
    });

    item.innerHTML = `
      <div class="archive-word">${w.text}</div>
      ${recsHtml ? `<div class="archive-recordings">${recsHtml}</div>` : ''}
    `;
    archiveList.appendChild(item);
  });

  // Логіка відтворення аудіо
  archiveList.querySelectorAll('.play-btn').forEach(btn => {
    btn.onclick = async () => {
      const recId = btn.dataset.id;
      const rec = recordings.find(r => r.id === recId);
      if (!rec || !rec.blob) return;

      const audioUrl = URL.createObjectURL(rec.blob);
      const audio = new Audio(audioUrl);
      btn.textContent = '❚❚';
      audio.play();
      audio.onended = () => {
        btn.textContent = '▶';
      };
    };
  });
}

function closeArchive() {
  archiveView.classList.remove('active');
  appState = 'idle';
}

/* ================= 7. ОБРОБКА ТАПІВ ТА СВАЙПІВ ================= */
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

window.addEventListener('touchend', async (e) => {
  const diffX = e.changedTouches[0].screenX - touchStartX;
  const diffY = e.changedTouches[0].screenY - touchStartY;
  const absX = Math.abs(diffX);
  const absY = Math.abs(diffY);

  // 1. Свайп вниз (порог > 45px) на головному екрані -> додати слово
  if (diffY > 45 && absY > absX && appState === 'idle') {
    openAddWord();
    return;
  }

  // 2. Свайп вгору під час вводу -> зберегти і закрити
  if (diffY < -45 && absY > absX && appState === 'adding') {
    await closeAndSaveNewWord();
    return;
  }

  // 3. Свайп вправо на головному -> відкрити архів
  if (diffX > 50 && absX > absY && appState === 'idle') {
    await openArchive();
    return;
  }

  // 4. Свайп вліво в архіві -> повернутися на головний
  if (diffX < -50 && absX > absY && appState === 'archive') {
    closeArchive();
    return;
  }
});

// Клік / Тап по екрану
mainView.addEventListener('click', async (e) => {
  // Якщо ми на головному у стані очікування -> почати запис
  if (appState === 'idle') {
    await startSession();
    return;
  }

  // Якщо йде запис -> тап у будь-яке місце зупиняє запис
  if (appState === 'recording') {
    await stopSession();
    return;
  }

  // Якщо екран підсумків (review)
  if (appState === 'review') {
    const wordEl = e.target.closest('.word-item');
    if (wordEl) {
      // Тап по слову -> викреслити / зняти викреслення
      const id = wordEl.dataset.id;
      if (struckWordIds.has(id)) {
        struckWordIds.delete(id);
        wordEl.classList.remove('struck');
      } else {
        struckWordIds.add(id);
        wordEl.classList.add('struck');
      }
    } else {
      // Тап по порожньому фону -> завершити підсумки і підібрати нові слова
      await completeReviewAndRefresh();
    }
  }
});

// Закриття поля додавання по клавіші Enter
newWordInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    await closeAndSaveNewWord();
  }
});

// Ініціалізація додатку при завантаженні
initDB().then(() => {
  renderMainWords();
});
</script>
</body>
</html>
