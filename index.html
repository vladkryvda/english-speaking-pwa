<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Vocalize</title>
  
  <!-- PWA & Apple Meta Tags -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vocalize">
  <meta name="theme-color" content="#FAFAFA">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      color-scheme: light only;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #FAFAFA;
      color: #171717;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .card-transition {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }

    input, textarea {
      background-color: #FFFFFF !important;
      color: #171717 !important;
    }

    .swipe-content {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #spotlight-panel {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- MINIMAL HEADER -->
  <header class="w-full px-6 pt-3 pb-3 flex justify-between items-center z-20">
    <nav class="flex items-center gap-5">
      <button id="tab-practice-btn" class="text-xs font-mono tracking-wider uppercase font-medium text-neutral-950 transition-colors">
        Practice <span id="queue-badge" class="text-[10px] text-neutral-400 font-normal ml-0.5">0</span>
      </button>
      <button id="tab-dictionary-btn" class="text-xs font-mono tracking-wider uppercase font-normal text-neutral-400 hover:text-neutral-950 transition-colors">
        Dictionary <span id="dict-badge" class="text-[10px] text-neutral-400 font-normal ml-0.5">0</span>
      </button>
    </nav>

    <button id="open-add-btn" class="text-neutral-400 hover:text-neutral-950 p-1 active:scale-90 transition-transform">
      <i data-lucide="plus" class="w-5 h-5 stroke-[1.5]"></i>
    </button>
  </header>

  <!-- ================= VIEW 1: PRACTICE ================= -->
  <main id="view-practice" class="flex-1 flex flex-col justify-between px-6 pb-12 pt-4 relative">
    
    <!-- Central Card Area -->
    <div class="flex-1 flex items-center justify-center">
      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center max-w-xs">
        <div class="w-10 h-10 rounded-full border border-neutral-200 flex items-center justify-center mx-auto mb-3 text-neutral-400">
          <i data-lucide="check" class="w-4 h-4 stroke-[1.5]"></i>
        </div>
        <p class="text-sm font-normal text-neutral-900 mb-1">All caught up</p>
        <p class="text-xs text-neutral-400 mb-5">No cards due for review right now.</p>
        <button onclick="openModal()" class="px-5 py-2 rounded-full border border-neutral-900 text-neutral-900 text-xs font-medium active:scale-95 transition-all">
          + Add Expression
        </button>
      </div>

      <!-- Active Practice Card -->
      <div id="card" class="card-transition w-full max-w-sm flex flex-col items-center text-center">
        <button id="tts-btn" title="Pronounce" class="text-neutral-400 hover:text-neutral-950 p-2 mb-3 active:scale-90 transition-all">
          <i data-lucide="volume-2" class="w-4 h-4 stroke-[1.5]"></i>
        </button>

        <h1 id="card-phrase" class="text-3xl sm:text-4xl font-light text-neutral-950 tracking-tight leading-tight mb-3">
          ...
        </h1>

        <p id="card-example" class="text-sm text-neutral-500 font-light leading-relaxed max-w-xs">
          ...
        </p>
      </div>
    </div>

    <!-- Bottom Controls Area -->
    <div class="w-full flex flex-col items-center">
      
      <!-- 1. RECORDING MODE WITH BENDING VECTOR LINE -->
      <div id="record-controls" class="flex flex-col items-center w-full max-w-xs">
        
        <!-- Bending Line Indicator Canvas -->
        <div class="w-48 h-10 flex items-center justify-center mb-2 relative">
          <canvas id="voice-line-canvas" class="w-full h-full"></canvas>
          <div id="timer-display" class="absolute -top-3 text-[10px] font-mono text-neutral-400 opacity-0 transition-opacity">00:00</div>
        </div>

        <!-- Solid Black Action Circle -->
        <button id="mic-toggle-btn" class="w-16 h-16 rounded-full bg-neutral-950 flex items-center justify-center active:scale-90 transition-all shadow-md">
          <div id="record-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 opacity-0 transition-opacity"></div>
        </button>
      </div>

      <!-- 2. REVIEW & GRADING MODE -->
      <div id="grade-controls" class="hidden w-full max-w-xs flex items-center justify-between gap-4">
        <button id="btn-again" class="flex-1 py-3.5 text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-neutral-900 transition-colors">
          ← Hard
        </button>

        <!-- Solid Black Play Circle -->
        <button id="btn-listen-self" title="Listen to yourself" class="w-12 h-12 rounded-full bg-neutral-950 text-white flex items-center justify-center active:scale-90 transition-all flex-shrink-0 shadow-sm">
          <i data-lucide="play" class="w-4 h-4 fill-white translate-x-0.5"></i>
        </button>

        <button id="btn-good" class="flex-1 py-3.5 text-xs font-mono uppercase tracking-wider text-neutral-900 font-medium transition-colors">
          Easy →
        </button>
      </div>

    </div>

  </main>

  <!-- ================= VIEW 2: DICTIONARY ================= -->
  <section id="view-dictionary" class="hidden flex-1 overflow-y-auto px-6 py-2 max-w-md w-full mx-auto relative overscroll-y-contain">
    <div id="pull-hint" class="text-center py-2 text-[10px] font-mono uppercase tracking-widest text-neutral-300 transition-opacity">
      ↓ Pull down to search
    </div>

    <!-- Clean Swipe-to-Delete List -->
    <div id="dict-list" class="space-y-2.5 pb-12 pt-1"></div>
  </section>

  <!-- ================= SPOTLIGHT SEARCH OVERLAY ================= -->
  <div id="spotlight-overlay" class="fixed inset-0 bg-neutral-950/20 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-200">
    <div id="spotlight-panel" class="w-full max-w-md mx-auto px-6 pt-[calc(env(safe-area-inset-top)+1rem)] pb-4 -translate-y-full">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl border border-neutral-200/80 shadow-2xl p-2.5 flex items-center gap-3">
        <i data-lucide="search" class="w-4 h-4 text-neutral-400 ml-2 stroke-[1.5]"></i>
        <input type="text" id="dict-search" placeholder="Search expressions..." autocomplete="off"
               class="flex-1 bg-transparent text-sm text-neutral-950 placeholder-neutral-400 focus:outline-none">
        <button id="close-spotlight-btn" class="text-xs font-mono text-neutral-400 hover:text-neutral-900 px-2 py-1">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- ================= ADD EXPRESSION MODAL ================= -->
  <div id="add-modal" class="fixed inset-0 bg-neutral-900/10 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 sm:p-7 border border-neutral-200/80 shadow-2xl relative">
      <div class="flex justify-between items-center mb-6">
        <span class="text-[11px] font-mono uppercase tracking-wider text-neutral-400">New Expression</span>
        <button onclick="closeModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-neutral-400 hover:text-neutral-900 transition-colors">
          <i data-lucide="x" class="w-4 h-4 stroke-[1.5]"></i>
        </button>
      </div>

      <form id="add-form" class="space-y-4">
        <div>
          <input type="text" id="in-phrase" required placeholder="Word or phrase" autocomplete="off"
                 class="w-full bg-white px-3.5 py-3 rounded-xl border border-neutral-200 text-sm font-normal text-neutral-900 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors">
        </div>

        <div>
          <textarea id="in-example" rows="2" placeholder="Example sentence or context (optional)" autocomplete="off"
                    class="w-full bg-white px-3.5 py-2.5 rounded-xl border border-neutral-200 text-xs font-light text-neutral-700 placeholder-neutral-300 focus:outline-none focus:border-neutral-900 transition-colors resize-none"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-between">
          <span class="text-[10px] font-mono text-neutral-400">↵ Enter</span>
          <button type="submit" class="px-6 py-2.5 rounded-full bg-neutral-950 text-white text-xs font-medium tracking-wide active:scale-95 transition-all">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= JS ENGINE ================= -->
  <script>
    /* 1. DATABASE (LOCAL-FIRST) */
    const DB_NAME = 'vocalize_clean_v5';
    let db;

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('cards')) {
            d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(); };
      });
    }

    async function getCards() {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readonly');
        const req = tx.objectStore('cards').getAll();
        req.onsuccess = () => res(req.result || []);
      });
    }

    async function saveCard(c) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(c);
        tx.oncomplete = () => res();
      });
    }

    async function deleteCard(id) {
      return new Promise(res => {
        const tx = db.transaction('cards', 'readwrite');
        tx.objectStore('cards').delete(id);
        tx.oncomplete = () => res();
      });
    }

    async function seedInitial() {
      const cards = await getCards();
      if (cards.length === 0) {
        const defaults = [
          { phrase: "figure out", example: "I need some time to figure this out.", nextDue: 0, reps: 0 },
          { phrase: "cut corners", example: "Never cut corners on product safety.", nextDue: 0, reps: 0 },
          { phrase: "come up with", example: "We have to come up with a better solution.", nextDue: 0, reps: 0 }
        ];
        for (let d of defaults) await saveCard(d);
      }
    }

    /* 2. APP STATE */
    let queue = [];
    let currentIndex = 0;
    let isRecording = false;
    let mediaRecorder = null;
    let audioContext = null;
    let analyser = null;
    let animFrameId = null;
    let recordedChunks = [];
    let lastAudioUrl = null;
    let timerInterval = null;
    let startTime = 0;

    async function initQueue() {
      const all = await getCards();
      const now = Date.now();
      queue = all.filter(c => (c.nextDue || 0) <= now);
      if (queue.length === 0 && all.length > 0) {
        queue = [all[Math.floor(Math.random() * all.length)]];
      }
      currentIndex = 0;
      updateUI();
      updateBadges(all.length, queue.length);
    }

    function updateBadges(total, due) {
      document.getElementById('dict-badge').textContent = total;
      document.getElementById('queue-badge').textContent = due;
    }

    function updateUI() {
      const empty = document.getElementById('empty-state');
      const card = document.getElementById('card');

      if (queue.length === 0 || currentIndex >= queue.length) {
        empty.classList.remove('hidden');
        card.classList.add('hidden');
        document.getElementById('record-controls').classList.add('hidden');
        document.getElementById('grade-controls').classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      card.classList.remove('hidden');
      document.getElementById('record-controls').classList.remove('hidden');
      document.getElementById('grade-controls').classList.add('hidden');

      const current = queue[currentIndex];
      document.getElementById('card-phrase').textContent = current.phrase;
      document.getElementById('card-example').textContent = current.example ? `“${current.example}”` : '';

      resetMicState();
    }

    function resetMicState() {
      isRecording = false;
      const btn = document.getElementById('mic-toggle-btn');
      const dot = document.getElementById('record-dot');
      btn.classList.remove('scale-105');
      dot.classList.add('opacity-0');
      document.getElementById('timer-display').classList.add('opacity-0');
      clearInterval(timerInterval);
      cancelAnimationFrame(animFrameId);
      drawIdleLine();
    }

    /* 3. VECTOR BENDING LINE OSCILLOSCOPE */
    const lineCanvas = document.getElementById('voice-line-canvas');
    const ctx = lineCanvas.getContext('2d');

    function resizeCanvas() {
      const rect = lineCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      lineCanvas.width = rect.width * dpr;
      lineCanvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      if (!isRecording) drawIdleLine();
    }
    window.addEventListener('resize', resizeCanvas);

    // Flat resting hairline
    function drawIdleLine() {
      const width = lineCanvas.width / (window.devicePixelRatio || 1);
      const height = lineCanvas.height / (window.devicePixelRatio || 1);
      const centerY = height / 2;

      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.strokeStyle = '#E5E5E5';
      ctx.lineWidth = 1.25;
      ctx.lineCap = 'round';
      ctx.moveTo(8, centerY);
      ctx.lineTo(width - 8, centerY);
      ctx.stroke();
    }

    // Dynamic bending line using Web Audio Time-Domain Data
    function renderBendingLine() {
      if (!isRecording) return;
      animFrameId = requestAnimationFrame(renderBendingLine);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteTimeDomainData(dataArray);

      const width = lineCanvas.width / (window.devicePixelRatio || 1);
      const height = lineCanvas.height / (window.devicePixelRatio || 1);
      const centerY = height / 2;

      ctx.clearRect(0, 0, width, height);

      const pointsCount = 36;
      const sliceWidth = (width - 16) / (pointsCount - 1);
      const step = Math.floor(bufferLength / pointsCount) || 1;
      const points = [];

      for (let i = 0; i < pointsCount; i++) {
        const val = (dataArray[i * step] - 128) / 128.0;
        // Edge dampening window (Hanning curve so endpoints anchor to center)
        const envelope = Math.sin(Math.PI * (i / (pointsCount - 1)));
        const yOffset = val * (height * 0.42) * envelope;
        
        points.push({
          x: 8 + i * sliceWidth,
          y: centerY + yOffset
        });
      }

      // Render smooth vector curve
      ctx.beginPath();
      ctx.strokeStyle = '#171717';
      ctx.lineWidth = 1.25;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.stroke();
    }

    /* 4. AUDIO RECORDING */
    const micBtn = document.getElementById('mic-toggle-btn');
    const dot = document.getElementById('record-dot');
    const timerDisplay = document.getElementById('timer-display');

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;
          const source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);

          mediaRecorder = new MediaRecorder(stream);
          recordedChunks = [];
          mediaRecorder.ondataavailable = e => e.data.size > 0 && recordedChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
            lastAudioUrl = URL.createObjectURL(blob);
            stream.getTracks().forEach(t => t.stop());
            if (audioContext && audioContext.state !== 'closed') audioContext.close();
          };

          mediaRecorder.start();
          isRecording = true;

          micBtn.classList.add('scale-105');
          dot.classList.remove('opacity-0');
          
          renderBendingLine();

          startTime = Date.now();
          timerDisplay.classList.remove('opacity-0');
          timerInterval = setInterval(() => {
            const s = Math.floor((Date.now() - startTime) / 1000);
            timerDisplay.textContent = `00:${String(s).padStart(2, '0')}`;
          }, 500);

        } catch (e) {
          alert('Microphone access is required.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        clearInterval(timerInterval);
        cancelAnimationFrame(animFrameId);
        isRecording = false;

        document.getElementById('record-controls').classList.add('hidden');
        document.getElementById('grade-controls').classList.remove('hidden');
        document.getElementById('grade-controls').classList.add('flex');
      }
    });

    /* 5. GRADING & CARDS FLOW */
    async function handleGrade(success) {
      const current = queue[currentIndex];
      const cardEl = document.getElementById('card');

      cardEl.style.transform = success ? 'translateX(30px)' : 'translateX(-30px)';
      cardEl.style.opacity = '0';

      if (success) {
        current.reps = (current.reps || 0) + 1;
        current.nextDue = Date.now() + (current.reps === 1 ? 24 : current.reps * 48) * 3600 * 1000;
      } else {
        current.reps = 0;
        current.nextDue = Date.now() + 10 * 60 * 1000;
      }
      await saveCard(current);

      setTimeout(() => {
        currentIndex++;
        cardEl.style.transform = 'translateX(0)';
        cardEl.style.opacity = '1';
        updateUI();
      }, 180);
    }

    document.getElementById('btn-again').addEventListener('click', () => handleGrade(false));
    document.getElementById('btn-good').addEventListener('click', () => handleGrade(true));

    document.getElementById('btn-listen-self').addEventListener('click', () => {
      if (lastAudioUrl) new Audio(lastAudioUrl).play();
    });

    document.getElementById('tts-btn').addEventListener('click', () => {
      const current = queue[currentIndex];
      if (current && 'speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(current.phrase);
        u.lang = 'en-US';
        u.rate = 0.9;
        speechSynthesis.speak(u);
      }
    });

    /* 6. NAVIGATION */
    const tabPracticeBtn = document.getElementById('tab-practice-btn');
    const tabDictBtn = document.getElementById('tab-dictionary-btn');
    const viewPractice = document.getElementById('view-practice');
    const viewDictionary = document.getElementById('view-dictionary');

    function switchTab(tab) {
      if (tab === 'practice') {
        viewPractice.classList.remove('hidden');
        viewDictionary.classList.add('hidden');

        tabPracticeBtn.className = "text-xs font-mono tracking-wider uppercase font-medium text-neutral-950 transition-colors";
        tabDictBtn.className = "text-xs font-mono tracking-wider uppercase font-normal text-neutral-400 hover:text-neutral-950 transition-colors";
        setTimeout(resizeCanvas, 50);
      } else {
        viewPractice.classList.add('hidden');
        viewDictionary.classList.remove('hidden');

        tabDictBtn.className = "text-xs font-mono tracking-wider uppercase font-medium text-neutral-950 transition-colors";
        tabPracticeBtn.className = "text-xs font-mono tracking-wider uppercase font-normal text-neutral-400 hover:text-neutral-950 transition-colors";

        renderDictionary();
      }
    }

    tabPracticeBtn.addEventListener('click', () => switchTab('practice'));
    tabDictBtn.addEventListener('click', () => switchTab('dictionary'));

    /* 7. DICTIONARY & CLEAN SWIPE-TO-DELETE */
    const dictList = document.getElementById('dict-list');
    let currentlySwipedRow = null;

    async function renderDictionary(filter = '') {
      const all = await getCards();
      const filtered = all.filter(c => 
        c.phrase.toLowerCase().includes(filter.toLowerCase()) || 
        (c.example && c.example.toLowerCase().includes(filter.toLowerCase()))
      );

      dictList.innerHTML = '';

      if (filtered.length === 0) {
        dictList.innerHTML = `<div class="py-12 text-center text-xs font-mono text-neutral-400">No expressions found</div>`;
        return;
      }

      filtered.forEach(card => {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = "relative overflow-hidden rounded-2xl select-none";
        
        itemWrapper.innerHTML = `
          <!-- Trash zone behind: neutral background, only the icon is red -->
          <div class="absolute inset-y-0 right-0 w-[64px] flex items-center justify-center text-red-500 active:opacity-70 transition-opacity" data-delete-id="${card.id}">
            <i data-lucide="trash-2" class="w-5 h-5 text-red-500 stroke-[1.75]"></i>
          </div>

          <!-- Pure white card on top -->
          <div class="swipe-content relative bg-white border border-neutral-200/80 rounded-2xl px-4 py-3.5 flex items-center justify-between z-10">
            <div class="flex-1 min-w-0 pr-3 pointer-events-none">
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-medium text-neutral-950 truncate">${card.phrase}</h4>
                <span class="text-[9px] font-mono text-neutral-400 border border-neutral-200/80 rounded px-1.5 py-0.2">
                  ${card.reps || 0} reps
                </span>
              </div>
              ${card.example ? `<p class="text-xs text-neutral-500 font-light truncate mt-0.5">${card.example}</p>` : ''}
            </div>

            <button class="tts-dict-btn p-2 text-neutral-300 hover:text-neutral-900 active:scale-90 transition-all flex-shrink-0" data-phrase="${card.phrase}">
              <i data-lucide="volume-2" class="w-4 h-4 stroke-[1.5]"></i>
            </button>
          </div>
        `;

        dictList.appendChild(itemWrapper);
        initSwipeGesture(itemWrapper.querySelector('.swipe-content'), itemWrapper.querySelector('[data-delete-id]'), card.id);
      });

      lucide.createIcons();

      dictList.querySelectorAll('.tts-dict-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const phrase = btn.dataset.phrase;
          const u = new SpeechSynthesisUtterance(phrase);
          u.lang = 'en-US';
          speechSynthesis.speak(u);
        });
      });
    }

    function initSwipeGesture(cardContent, deleteBtn, cardId) {
      let startX = 0;
      let isSwiping = false;
      const threshold = 64;

      function setTransform(x, transition = false) {
        cardContent.style.transition = transition ? 'transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)' : 'none';
        cardContent.style.transform = `translateX(${x}px)`;
      }

      cardContent.addEventListener('touchstart', (e) => {
        if (currentlySwipedRow && currentlySwipedRow !== cardContent) {
          currentlySwipedRow.style.transform = 'translateX(0px)';
          currentlySwipedRow = null;
        }
        startX = e.touches[0].clientX;
        isSwiping = true;
      }, { passive: true });

      cardContent.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        let diff = e.touches[0].clientX - startX;
        if (diff < 0) {
          if (diff < -threshold) diff = -threshold + (diff + threshold) * 0.2;
          setTransform(diff, false);
        } else {
          setTransform(0, false);
        }
      }, { passive: true });

      cardContent.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        isSwiping = false;
        const diff = e.changedTouches[0].clientX - startX;

        if (diff < -threshold / 2) {
          setTransform(-threshold, true);
          currentlySwipedRow = cardContent;
        } else {
          setTransform(0, true);
          if (currentlySwipedRow === cardContent) currentlySwipedRow = null;
        }
      });

      deleteBtn.addEventListener('click', async () => {
        const wrapper = cardContent.parentElement;
        wrapper.style.transition = 'all 0.2s cubic-bezier(0.16, 1, 0.3, 1)';
        wrapper.style.maxHeight = wrapper.offsetHeight + 'px';
        wrapper.style.opacity = '0';
        wrapper.style.transform = 'scale(0.95)';

        setTimeout(async () => {
          wrapper.style.maxHeight = '0px';
          wrapper.style.margin = '0px';
          wrapper.style.padding = '0px';

          setTimeout(async () => {
            await deleteCard(cardId);
            const allCards = await getCards();
            updateBadges(allCards.length, queue.length);
            await renderDictionary(document.getElementById('dict-search').value);
            await initQueue();
          }, 180);
        }, 120);
      });
    }

    document.addEventListener('touchstart', (e) => {
      if (currentlySwipedRow && !currentlySwipedRow.contains(e.target) && !e.target.closest('[data-delete-id]')) {
        currentlySwipedRow.style.transform = 'translateX(0px)';
        currentlySwipedRow = null;
      }
    });

    /* 8. SPOTLIGHT SEARCH */
    const spotlightOverlay = document.getElementById('spotlight-overlay');
    const spotlightPanel = document.getElementById('spotlight-panel');
    const dictSearch = document.getElementById('dict-search');
    const closeSpotlightBtn = document.getElementById('close-spotlight-btn');

    function openSpotlight() {
      spotlightOverlay.classList.remove('hidden');
      setTimeout(() => {
        spotlightOverlay.classList.remove('opacity-0');
        spotlightPanel.classList.remove('-translate-y-full');
        dictSearch.focus();
      }, 10);
    }

    function closeSpotlight() {
      spotlightOverlay.classList.add('opacity-0');
      spotlightPanel.classList.add('-translate-y-full');
      dictSearch.value = '';
      dictSearch.blur();
      renderDictionary('');
      setTimeout(() => {
        spotlightOverlay.classList.add('hidden');
      }, 200);
    }

    closeSpotlightBtn.addEventListener('click', closeSpotlight);

    spotlightOverlay.addEventListener('click', (e) => {
      if (e.target === spotlightOverlay) closeSpotlight();
    });

    dictSearch.addEventListener('input', (e) => {
      renderDictionary(e.target.value);
    });

    let pullStartY = 0;
    viewDictionary.addEventListener('touchstart', (e) => {
      if (viewDictionary.scrollTop <= 0) {
        pullStartY = e.touches[0].clientY;
      } else {
        pullStartY = 0;
      }
    }, { passive: true });

    viewDictionary.addEventListener('touchmove', (e) => {
      if (pullStartY > 0 && viewDictionary.scrollTop <= 0) {
        const pullDistance = e.touches[0].clientY - pullStartY;
        if (pullDistance > 60) {
          pullStartY = 0;
          openSpotlight();
        }
      }
    }, { passive: true });

    /* 9. MODAL ADD */
    const modal = document.getElementById('add-modal');
    const inPhrase = document.getElementById('in-phrase');
    const inExample = document.getElementById('in-example');

    window.openModal = () => {
      modal.classList.remove('hidden');
      setTimeout(() => inPhrase.focus(), 60);
    };

    window.closeModal = () => modal.classList.add('hidden');
    document.getElementById('open-add-btn').addEventListener('click', openModal);

    inPhrase.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('add-form').requestSubmit();
      }
    });

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phrase = inPhrase.value.trim();
      const example = inExample.value.trim();
      if (!phrase) return;

      await saveCard({ phrase, example, nextDue: 0, reps: 0 });
      e.target.reset();
      closeModal();
      await initQueue();
      if (!viewDictionary.classList.contains('hidden')) {
        renderDictionary();
      }
    });

    /* 10. BOOTSTRAP & SERVICE WORKER */
    window.addEventListener('DOMContentLoaded', async () => {
      await openDB();
      await seedInitial();
      await initQueue();
      resizeCanvas();
      lucide.createIcons();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
